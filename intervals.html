  <script type="text/x-mlh-jsx-source" data-runtime="intervals-1.js">

const LEVEL_INTERVALS = {
  N5: [2, 8],
  H: [2, 3, 4, 5, 6, 7, 8],
  AH: [2, 3, 4, 5, 6, 7, 8, "tritone", "augmented-4th", "diminished-5th"],
};

const KEY_SIGNATURES = {
  C: { label: "C major", accidentals: [] },
  G: { label: "G major", accidentals: [{ type: "sharp", step: 8, letter: "F" }] },
  F: { label: "F major", accidentals: [{ type: "flat", step: 4, letter: "B" }] },
  D: { label: "D major", accidentals: [{ type: "sharp", step: 8, letter: "F" }, { type: "sharp", step: 5, letter: "C" }] },
  Bb: { label: "B flat major", accidentals: [{ type: "flat", step: 4, letter: "B" }, { type: "flat", step: 7, letter: "E" }] },
};

const CHROMATIC_INTERVALS = [
  { id: "tritone-f-b", startIndex: 5, endIndex: 8, key: "C" },
  { id: "augmented-4th-c-fsharp", startIndex: 2, endIndex: 5, key: "C", targetAccidental: "sharp" },
  { id: "augmented-4th-g-csharp", startIndex: 6, endIndex: 9, key: "D" },
  { id: "diminished-5th-b-f", startIndex: 8, endIndex: 12, key: "C" },
  { id: "diminished-5th-e-bflat", startIndex: 4, endIndex: 8, key: "F" },

];

const CHROMATIC_INTERVAL_WEIGHTS = CHROMATIC_INTERVALS.flatMap((interval) =>
  interval.id.startsWith("tritone") ? [interval, interval, null] : [interval, interval]
);

const NOTE_NAME_LABELS = {
  treble: {
    top: STAFF.trebleTop,
    lines: [
      { step: 0, letter: "E" },
      { step: 2, letter: "G" },
      { step: 4, letter: "B" },

    ],
    spaces: [
      { step: 1, letter: "F" },

    ],
  },
};

function randomIndex(length) {
  return Math.floor(exerciseRandom() * length);
}

function randomItem(items) {
  return items[randomIndex(items.length)];
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function noteByIndex(index) {
  return NOTES[clamp(index, 0, NOTES.length - 1)];
}

const NATURAL_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function accidentalOffset(type) {
  if (type === "sharp") return 1;
  if (type === "flat") return -1;
  return 0;
}

function keySignatureAccidental(note, keySignature = []) {
  return keySignature.find((item) => item.letter === note.letter)?.type || null;
}

function writtenPitch(note, keySignature = [], explicitAccidental = null) {
  const accidental = explicitAccidental || keySignatureAccidental(note, keySignature);
  return note.octave * 12 + NATURAL_SEMITONES[note.letter] + accidentalOffset(accidental);
}

function semitoneDistance(startIndex, endIndex, keySignature = [], targetAccidental = null, startAccidental = null) {
  const startNote = noteByIndex(startIndex);
  const endNote = noteByIndex(endIndex);
  return Math.abs(writtenPitch(endNote, keySignature, targetAccidental) - writtenPitch(startNote, keySignature,startAccidental));
}

function intervalNameFromHalfSteps(startIndex, endIndex, keySignature = [], targetAccidental = null,startAccidental = null) {
  const diatonicSize = Math.abs(endIndex - startIndex) + 1;
  const halfSteps = semitoneDistance(startIndex, endIndex, keySignature, targetAccidental,startAccidental);

  if (halfSteps === 4 && diatonicSize === 4) return "Diminished 4th";
  if (halfSteps === 6 && diatonicSize === 4) return "Augmented 4th";
  if (halfSteps === 6 && diatonicSize === 5) return "Diminished 5th";
  if (halfSteps === 8 && diatonicSize === 5) return "Augmented 5th";
  if (halfSteps === 6) return "Tritone";

  return intervalLabel(diatonicSize);
}


function normalizeText(value) {
  return String(value || "").toLowerCase().replace(/[-\s]/g, "");
}

function answerMatchesLabel(raw, label, allowTritone = false) {
  const compact = normalizeText(raw);
  const target = normalizeText(label);
  const accepted = new Set([target]);

  if (allowTritone) accepted.add("tritone");

  if (target === "augmented4th") {
    accepted.add("augmentedfourth");
    accepted.add("aug4");
    accepted.add("augmentedforth");
    accepted.add("aug4th");
  }

  if (target === "diminished4th") {
    accepted.add("dim4");
    accepted.add("diminishedfourth");
    accepted.add("dimished4th");
    accepted.add("dimishedfourth");
  }

  if (target === "diminished5th") {
    accepted.add("dim5");
    accepted.add("diminishedfifth");
    accepted.add("dimished5th");
    accepted.add("dimishedfifth");
  }

  if (target === "augmented5th") {
    accepted.add("aug5");
    accepted.add("augmentedfifth");
    accepted.add("aug5th");
  }

  return accepted.has(compact);
}

function typedFeedbackLabel(question) {
  if (!question.chromatic) {
    if (question.answer === "2nd") {
      const distance = semitoneDistance(question.startIndex, question.endIndex, question.keySignature, question.targetAccidental);
      if (distance === 1) return "2nd or semitone";
      if (distance === 2) return "2nd or tone";
    }
    return question.answer;
  }
  if(question.answer==="Tritone")return "Tritone or "+intervalNameFromHalfSteps(question.startIndex,question.endIndex,question.keySignature,question.targetAccidental,question.startAccidental);
  if (question.answer === "Augmented 4th" || question.answer === "Diminished 5th") {
    return `Tritone or ${question.answer}`;
  }
  return question.answer;
}

function intervalAnswerMatches(raw, label, question = null) {
  if (answerMatchesLabel(raw, label)) return true;

  const compact = normalizeText(raw);
  const target = normalizeText(label);
  if (target === "2nd" && question && (compact === "tone" || compact === "semitone")) {
    const distance = semitoneDistance(question.startIndex, question.endIndex, question.keySignature, question.targetAccidental);
    return (compact === "tone" && distance === 2) || (compact === "semitone" && distance === 1);
  }
  const simpleAliases = {
    "2nd": ["2", "second"],
    "3rd": ["3", "third"],
    "4th": ["4", "fourth"],
    "5th": ["5", "fifth"],
    "6th": ["6", "sixth"],
    "7th": ["7", "seventh"],
    octave: ["8", "8th"],
  };

  return simpleAliases[target]?.includes(compact) || false;
}

function intervalLabel(size) {
  if (typeof size === "string") return CHROMATIC_INTERVALS.find((interval) => interval.id === size)?.label ?? size;
  return INTERVALS.find((interval) => interval.size === size)?.label ?? `${size}th`;
}

function intervalsForLevel(level) {
  const allowed = LEVEL_INTERVALS[level] || LEVEL_INTERVALS.N5;
  return allowed
    .filter((item) => typeof item === "number")
    .map((size) => INTERVALS.find((interval) => interval.size === size))
    .filter(Boolean);
}

function answerOptionsForQuestion(question, level) {
  if (question.typedMode) return [];
  if (level === "N3") return ["Step", "Leap"].map((label) => ({ id: label, label }));
  return intervalsForLevel(level).map((interval) => ({ id: interval.size, label: interval.label }));
}

function yForStep(top, step) {
  return top + STAFF.gap * 4 - step * (STAFF.gap / 2);
}

function indexFromStep(step) {
  return NOTES.findIndex((note) => note.step === step);
}

function noteRangeForLevel(level) {
  if (level === "AH") {
    return { minStep: NOTES[0].step, maxStep: NOTES.at(-1).step };
  }
  return { minStep: -2, maxStep: 10 };
}

function noteIndexesForLevel(level) {
  const { minStep, maxStep } = noteRangeForLevel(level);
  return NOTES
    .map((note, index) => ({ note, index }))
    .filter(({ note }) => note.step >= minStep && note.step <= maxStep)
    .map(({ index }) => index);
}

function stepFromSvgYForLevel(y, top, level) {
  const rawStep = Math.round((top + STAFF.gap * 4 - y) / (STAFF.gap / 2));
  const { minStep, maxStep } = noteRangeForLevel(level);
  return clamp(rawStep, minStep, maxStep);
}

function stemDown(step) {
  return step > 4;
}

function createQuestion(mode = "identify", level = "N5") {
  return window.MLHIntervalsWorksheet.generateQuestion({ mode, level, random: exerciseRandom });
}

function pickQuestionMode(enabledModes,level='H') {return window.MLHIntervalsWorksheet.pickMode(enabledModes,level,exerciseRandom);}

const DEFAULT_ENABLED_MODES = { identify: true, create: true };

function taskMatchesLevel(enabledModes) {
  return Object.keys(DEFAULT_ENABLED_MODES).every(key => Boolean(enabledModes[key]) === DEFAULT_ENABLED_MODES[key]);
}

const playFeedbackSound = (...args) => window.MLH?.playFeedbackSound?.(...args);

function sharedSymbolConfig(key) {
  return SHARED_CONFIG.symbols?.[key] ?? {};
}

function sharedSymbolForKey(key) {
  return SHARED_SYMBOLS[key] ?? "";
}

function accidentalSymbolKey(type, context = "score") {
  if (context === "keySignature") return type === "sharp" ? "sharpKeySignature" : "flatKeySignature";
  if (type === "sharp") return "sharpInScore";
  if (type === "flat") return "flatInScore";
  return "naturalInScore";
}

function noteSymbolKey(step) {
  return stemDown(step) ? "quarterNoteStemDown" : "quarterNoteStemUp";
}

function calibrationAnchorX(symbolKey, left = STAFF.left) {
  if (symbolKey === "gClef") return left + STAFF.gap * 2.5;
  return left;
}

function calibrationAnchorY(symbolKey, top = STAFF.trebleTop) {
  if (symbolKey === "gClef") return yForStep(top, 2);
  return yForStep(top, 4);
}

function CalibratedSymbol({ symbolKey, x, y, colour = "currentColor", opacity = 1, lineGap = STAFF.gap, settingOverrides = {} }) {
  const actualKey = ({sharpKeySignature:"sharp",flatKeySignature:"flat",sharpInScore:"sharp",flatInScore:"flat",naturalInScore:"natural"})[symbolKey]||symbolKey;
  const symbol = sharedSymbolForKey(actualKey);
  const settings = { ...sharedSymbolConfig(symbolKey), ...settingOverrides };
  const fontSize = lineGap * (settings.fontSizeScale ?? 1);
  const xOffset = lineGap * (settings.xOffsetScale ?? 0) + (settings.opticalXOffset ?? 0);
  const yOffset = lineGap * (settings.yOffsetScale ?? 0) + (settings.opticalYOffset ?? 0);
  const widthScale = settings.widthScale ?? 1;
  const heightScale = settings.heightScale ?? 1;

  if (!symbol) return null;

  return (
    <text
      className="music-symbol"
      x={x + xOffset}
      y={y + yOffset}
      fontSize={fontSize}
      textAnchor="middle"
      fill={colour}
      opacity={opacity}
      transform={`translate(${x + xOffset} ${y + yOffset}) scale(${widthScale} ${heightScale}) translate(${-x - xOffset} ${-y - yOffset})`}
    >
      {symbol}
    </text>
  );
}

function LedgerLines({ x, step, colour = "currentColor" }) {
  const settings = sharedSymbolConfig("ledgerLines");
  const drawing = SHARED_CONFIG.drawing ?? {};
  const halfWidth = (STAFF.gap * (drawing.ledgerLineWidthScale ?? 2.4) * (settings.widthScale ?? 1)) / 2;
  const thickness = Math.max(1, STAFF.gap * (drawing.ledgerLineThicknessScale ?? 0.11) * (settings.heightScale ?? 1));
  const xOffset = STAFF.gap * (settings.xOffsetScale ?? 0) + (settings.opticalXOffset ?? 0);
  const yOffset = STAFF.gap * (settings.yOffsetScale ?? 0) + (settings.opticalYOffset ?? 0);
  const lines = [];
  if (step <= -2) {
    for (let ledgerStep = -2; ledgerStep >= step; ledgerStep -= 2) lines.push(ledgerStep);
  }
  if (step >= 10) {
    for (let ledgerStep = 10; ledgerStep <= step; ledgerStep += 2) lines.push(ledgerStep);
  }

  return (
    <g pointerEvents="none">
      {lines.map((lineStep) => (
        <line
          key={lineStep}
          x1={x + xOffset - halfWidth}
          x2={x + xOffset + halfWidth}
          y1={yForStep(STAFF.trebleTop, lineStep) + yOffset}
          y2={yForStep(STAFF.trebleTop, lineStep) + yOffset}
          stroke={colour}
          strokeWidth={thickness}
        />
      ))}
    </g>
  );
}

function RhythmNote({ x, y, step, colour = "currentColor", opacity = 1, preview = false, scale = 1 }) {
  return (
    <g opacity={opacity} pointerEvents="none" transform={scale !== 1 ? `translate(${x} ${y}) scale(${scale}) translate(${-x} ${-y})` : undefined}>
      <CalibratedSymbol symbolKey={noteSymbolKey(step)} x={x} y={y} colour={colour} />
    </g>
  );
}

function Staff({ gradientId = "intervalStaffFade" }) {
  return (
    <g>
      <defs>
        <linearGradient id={gradientId} x1={STAFF.left} y1="0" x2={STAFF.right} y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#000" stopOpacity="1" />
          <stop offset="86%" stopColor="#000" stopOpacity="1" />
          <stop offset="100%" stopColor="#000" stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 1, 2, 3, 4].map((line) => (
        <line key={line} x1={STAFF.left} x2={STAFF.right} y1={STAFF.trebleTop + line * STAFF.gap} y2={STAFF.trebleTop + line * STAFF.gap} stroke={`url(#${gradientId})`} strokeWidth="1.5" />
      ))}
      <CalibratedSymbol symbolKey="gClef" x={calibrationAnchorX("gClef")} y={calibrationAnchorY("gClef")} />
    </g>
  );
}

function KeySignature({ signature = [] }) {
  return (
    <g pointerEvents="none">
      {signature.map((item, index) => {
        const x = STAFF.left + 92 + index * 30;
        return (
          <CalibratedSymbol
            key={`${item.type}-${item.step}-${index}`}
            x={x}
            y={yForStep(STAFF.trebleTop, item.step)}
            symbolKey={accidentalSymbolKey(item.type, "keySignature")}
          />
        );
      })}
    </g>
  );
}


function IntervalHelpNumbers({ question, startX, secondX }) {
  if (question.chromatic) return null;
  const endIndex = question.type === "identify" ? question.endIndex : question.targetIndex;
  const noteCount = Math.abs(endIndex - question.startIndex) + 1;
  const direction = endIndex >= question.startIndex ? 1 : -1;
  const totalDistance = Math.max(1, Math.abs(endIndex - question.startIndex));

  return (
    <g fontSize="22" fontWeight="500" fill="black" opacity="0.25" pointerEvents="none">
      {Array.from({ length: noteCount }, (_, countIndex) => {
        const noteIndex = question.startIndex + countIndex * direction;
        const note = noteByIndex(noteIndex);
        const x = startX + ((secondX - startX) * countIndex) / totalDistance;
        return <text key={`${note.name}-${countIndex}`} x={x + 26} y={yForStep(STAFF.trebleTop, note.step) + 7} textAnchor="middle">{countIndex + 1}</text>;
      })}
    </g>
  );
}

function Note({ x, note, colour = "currentColor", opacity = 1, preview = false, scale = 1, accidental = null }) {
  const y = yForStep(STAFF.trebleTop, note.step);
  return (
    <g>
      <LedgerLines x={x} step={note.step} colour={colour} />
      {accidental && <CalibratedSymbol symbolKey={accidentalSymbolKey(accidental)} x={x - STAFF.gap * 2.1} y={y} colour={colour} />}
      <RhythmNote x={x} y={y} step={note.step} colour={colour} opacity={opacity} preview={preview} scale={scale} />
    </g>
  );
}

function ScoreArea({ question, mode, showHelp, hoverIndex, selectedIndex, feedback, selectedAnswer, touchPreview, activeLevel, mobileZoom = false, compact = false, onPointerMove, onPointerDown, onPointerUp, onPointerCancel,onKeyDown,disabled=false }) {
  const startX = mode === "identify" ? 392 : 382;
  const secondX = mode === "identify" ? 536 : 536;
  const startNote = noteByIndex(question.startIndex);
  const targetIndex = mode === "identify" ? question.endIndex : question.targetIndex;
  const targetNote = noteByIndex(targetIndex);
  const workingIndex = touchPreview?.active ? touchPreview.index : selectedIndex ?? hoverIndex;
  const workingNote = mode === "create" && workingIndex != null ? noteByIndex(workingIndex) : null;
  const selectedNote = mode === "create" && selectedIndex != null ? noteByIndex(selectedIndex) : null;
  const correctIdentifyAnswer = question.answer ?? question.intervalSize;
  const identifyCorrect = feedback && mode === "identify" && selectedAnswer === correctIdentifyAnswer && activeLevel !== "N5";
  const identifyIncorrect = feedback && mode === "identify" && selectedAnswer !== correctIdentifyAnswer;
  const createCorrect = feedback && mode === "create" && selectedIndex === question.targetIndex;
  const createIncorrect = feedback && mode === "create" && selectedIndex !== question.targetIndex;

  const viewBox = compact ? { x: 195, y: 60, width: 520, height: 235 } : mobileZoom ? { x: 195, y: 112, width: SVG.width / 1.806, height: SVG.height / 1.806 } : { x: 0, y: 0, width: SVG.width, height: SVG.height };

  return (
    <svg viewBox={`${viewBox.x} ${viewBox.y} ${viewBox.width} ${viewBox.height}`} className="h-auto w-full select-none overflow-visible">
      <rect width={SVG.width} height={SVG.height} fill="white" />
      <Staff gradientId={mobileZoom ? "intervalStaffFadeMobile" : "intervalStaffFadeDesktop"} />
      <KeySignature signature={question.keySignature} />

      <Note x={startX} note={startNote} accidental={question.startAccidental} />

      {mode === "identify" && (
        <>
          <Note
            x={secondX}
            note={targetNote}
            accidental={question.targetAccidental}
            colour="currentColor"
          />
          {showHelp && <IntervalHelpNumbers question={question} startX={startX} secondX={secondX} />}
        </>
      )}

      {mode === "create" && !feedback && !touchPreview?.active && workingNote && (
        <Note x={secondX} note={workingNote} colour={selectedIndex == null ? COLOUR.preview : "currentColor"} opacity={selectedIndex == null ? 0.55 : 1} preview={selectedIndex == null} />
      )}

      {mode === "create" && createCorrect && selectedNote && <Note x={secondX} note={selectedNote} colour={COLOUR.green} />}

      {mode === "create" && createIncorrect && selectedNote && (
        <>

function IntervalOptions({ selectedAnswer, disabled, onSelect, feedback, question, level }) {
  const options = answerOptionsForQuestion(question, level);
  const correctAnswer = question.intervalSize;
  const useFullWidthRow = options.length >= 7;
  return (
    <div className={useFullWidthRow ? "grid w-full grid-cols-7 gap-2" : "flex flex-wrap gap-2"}>
      {options.map((option) => {
        const isSelected = selectedAnswer === option.id;
        const isCorrect = correctAnswer === option.id;
        let buttonClass = "border-stone-300 bg-white text-stone-900";

        if (feedback) {
          if (isCorrect) {
            buttonClass = "border-green-700 bg-green-600 text-white";
          } else if (isSelected && !isCorrect) {
            buttonClass = "border-red-700 bg-red-600 text-white";
          } else {
            buttonClass = "border-stone-300 bg-white text-stone-900 opacity-60";
          }
        } else if (isSelected) {
          buttonClass = "border-stone-950 bg-stone-950 text-white";
        }

        return (
          <button
            key={option.id}
            type="button"
            disabled={disabled}
            onClick={() => onSelect(option.id)}
            className={`flex h-[48px] ${useFullWidthRow ? "w-full" : "w-[92px]"} items-center justify-center rounded-xl border px-3 text-sm font-bold transition ${buttonClass}`}

            {option.label}

      })}

function consumeWorksheetReturnConfig() {
  try {
    const parsed = JSON.parse(window.sessionStorage.getItem("worksheetReturnConfig") || "null");
    if (!parsed || parsed.version !== 1 || parsed.activityId !== "intervals" || !parsed.settings || !LEVELS[parsed.settings.level]) return null;
    window.sessionStorage.removeItem("worksheetReturnConfig");
    return parsed;
  } catch {
    return null;
  }
}

function App() {

    if (worksheetReturnConfig?.settings?.level) return worksheetReturnConfig.settings.level;

    return LEVELS[requested] ? requested : "N5";
  }, [worksheetReturnConfig]);
  const initialEnabledModes = worksheetReturnConfig?.settings?.enabledModes || { identify: true, create: true };
  const initialQuestionMode = useMemo(() => ["N3", "N5"].includes(initialLevel) ? "identify" : pickQuestionMode(window.MLH.profileInitial("enabledModes", initialEnabledModes),initialLevel), [initialLevel]);
  const [activeLevel, setActiveLevel] = useState(initialLevel);
  const [savedModes, setEnabledModes] = window.MLH.useProfileState("enabledModes", initialEnabledModes);
  const enabledModes=window.MLHIntervalsWorksheet.normaliseModes(savedModes);

  const [touchPreview, setTouchPreview] = useState(null);
  const [feedback, setFeedback] = useState(null);

  const [confettiKey, setConfettiKey] = useState(0);

  const customiseRef = useRef(null);
  const levelRef = useRef(null);
  const feedbackFadeTimerRef = useRef(null);
  const feedbackNextTimerRef = useRef(null);
  const questionTimerRef = useRef(null);
  const touchPreviewRef = useRef(null),answerLock=useRef(false),medalTimerRef=useRef(null);
  function updateTouchPreview(nextPreview){touchPreviewRef.current=nextPreview;setTouchPreview(nextPreview);}
  const levelTaskStatusRef = useRef(null);
  const keyboard = window.MLH.useKeyboardReset();

  window.MLH.useClickOutside(

  const canConfirm = mode === "create" ? selectedIndex != null && !feedback && questionVisible : false;

      : <>Create an interval <strong>{intervalLabel(question.intervalSize).toLowerCase()}</strong> <strong>{question.direction}</strong> than the note given.</>;

  function resetTask(nextQuestion = question) {
    answerLock.current=false;setQuestion(nextQuestion);
    setHoverIndex(null);
    setSelectedIndex(null);
    setSelectedAnswer(null);
    setTypedAnswer("");
    setTypedResult(null);
    updateTouchPreview(null);
    setFeedback(null);
    setFeedbackFading(false);
    setPrompt("");
  }

    }

      feedbackNextTimerRef.current = null;
    }

      window.clearTimeout(questionTimerRef.current);

    }
  }

  function newQuestion(nextEnabledModes = enabledModes, nextLevel = activeLevel) {
    clearFeedbackTimers();
    answerLock.current=true;setQuestionVisible(false);
    questionTimerRef.current = window.setTimeout(() => {
      const nextMode = ["N3", "N5"].includes(nextLevel) ? "identify" : pickQuestionMode(nextEnabledModes,nextLevel);
      setMode(nextMode);
      resetTask(createQuestion(nextMode, nextLevel));
      setQuestionVisible(true);
      questionTimerRef.current = null;
    }, 260);
  }

  function resetScore() {
    clearFeedbackTimers();
    setCorrect(0);
    setAttempted(0);
    setStreak(0);
    setBestStreak(0);
    setConfettiKey(0);
    setTypedAnswer("");
    setTypedResult(null);
    newQuestion(enabledModes);
  }

  React.useEffect(() => {
    if (levelTaskStatusRef.current === null) {
      levelTaskStatusRef.current = medalEligible;
      return;
    }
    if (levelTaskStatusRef.current === medalEligible) return;
    levelTaskStatusRef.current = medalEligible;

    setConfettiKey(0);
  }, [medalEligible]);

  function applyLevel(levelKey) {
    clearFeedbackTimers();
    const nextEnabledModes = { ...DEFAULT_ENABLED_MODES };
    const url=new URL(window.location.href);url.searchParams.set("level",levelKey);window.history.replaceState(null,"",url);

    setEnabledModes(nextEnabledModes);

    setLevelOpen(false);
    setCustomiseOpen(false);

    setTypedAnswer("");
    setTypedResult(null);
    answerLock.current=true;setQuestionVisible(false);
    questionTimerRef.current=window.setTimeout(() => {
      const nextMode = ["N3", "N5"].includes(levelKey) ? "identify" : pickQuestionMode(nextEnabledModes,levelKey);
      setMode(nextMode);
      resetTask(createQuestion(nextMode, levelKey));
      setQuestionVisible(true);
    }, 260);
  }

  function fadeToNextQuestion() {
    if (!feedback || feedback.correct || feedbackFading) return;
    clearFeedbackTimers();

    feedbackNextTimerRef.current = window.setTimeout(() => {
      newQuestion(enabledModes, activeLevel);
      feedbackNextTimerRef.current = null;
    }, 280);
  }

  function skipCorrectFeedback() {
    if (!feedback || !feedback.correct) return;
    clearFeedbackTimers();
    newQuestion(enabledModes, activeLevel);
  }

  function scoreAnswer(isCorrect) {
    if(answerLock.current||feedback||!questionVisible)return;answerLock.current=true;
    clearFeedbackTimers();
    const nextStreak = isCorrect ? streak + 1 : 0;
    playFeedbackSound(isCorrect);
    setAttempted((value) => value + 1);
    setCorrect((value) => value + (isCorrect ? 1 : 0));
    setStreak(nextStreak);
    setBestStreak((value) => Math.max(value, nextStreak));
    setFeedback({ correct: isCorrect });

    if (medalEligible && isCorrect && [10, 15, 20, 30].includes(nextStreak)) {
      const medal = getStreakMedal(nextStreak);
      setConfettiKey((value) => value + 1);
      medalTimerRef.current=window.setTimeout(() => playFeedbackSound(true, true, medal.sound), 180);
    }

    if (isCorrect) {
      setFeedbackFading(false);
      feedbackFadeTimerRef.current = window.setTimeout(() => {
        setFeedbackFading(true);
        feedbackFadeTimerRef.current = null;
      }, 1700);
      feedbackNextTimerRef.current = window.setTimeout(() => {
        newQuestion(enabledModes, activeLevel);
        feedbackNextTimerRef.current = null;
      }, 2000);
    }
  }

  function selectInterval(intervalSize) {
    if (feedback || answerLock.current || !questionVisible || mode !== "identify") return;
    setSelectedAnswer(intervalSize);
    scoreAnswer(intervalSize === question.intervalSize);
  }

  function submitTypedAnswer() {
    if (feedback || answerLock.current || !questionVisible || mode !== "identify" || !question.typedMode || !typedAnswer.trim()) return;
    const correct = question.chromatic ? (answerMatchesLabel(typedAnswer, question.answer, true)||answerMatchesLabel(typedAnswer,intervalNameFromHalfSteps(question.startIndex,question.endIndex,question.keySignature,question.targetAccidental,question.startAccidental))) : intervalAnswerMatches(typedAnswer, question.answer, question);
    setTypedResult(correct ? null : typedFeedbackLabel(question));
    scoreAnswer(correct);
  }
  function clearTypedAnswer() {
    if (feedback || answerLock.current || !questionVisible || mode !== "identify" || !question.typedMode) return;
    setTypedAnswer("");
    setTypedResult(null);
    setPrompt("");
  }

  function confirmAnswer() {
    if (feedback || answerLock.current || !questionVisible || mode !== "create") return;
    if (selectedIndex == null) {
      setPrompt("Place the second note first.");
      return;
    }
    scoreAnswer(selectedIndex === question.targetIndex);
  }
  function clearCreateAnswer() {
    if (feedback || answerLock.current || !questionVisible || mode !== "create") return;
    setSelectedIndex(null);
    setPrompt("");
  }

  function pointerToSvg(event) {
    const svg = event.currentTarget.ownerSVGElement;
    const rect = svg.getBoundingClientRect();
    const viewBox = svg.viewBox.baseVal;
    return {
      x: viewBox.x + ((event.clientX - rect.left) / rect.width) * viewBox.width,
      y: viewBox.y + ((event.clientY - rect.top) / rect.height) * viewBox.height,
    };
  }

  function getPointerIndex(event, begin = false) {
    const pointer = pointerToSvg(event);
    const placedNote = selectedIndex == null ? null : noteByIndex(selectedIndex);
    const placedY = placedNote ? yForStep(STAFF.trebleTop, placedNote.step) : null;
    const pickingUpNote = begin && placedNote && Math.abs(pointer.x - 536) <= 36 && Math.abs(pointer.y - placedY) <= 20;
    const touchOffset = pickingUpNote ? pointer.y - placedY : !begin && touchPreviewRef.current?.active ? touchPreviewRef.current.yOffset : event.pointerType === "touch" ? 64 : 0;
    const step = stepFromSvgYForLevel(pointer.y - touchOffset, STAFF.trebleTop, activeLevel);
    const index = indexFromStep(step);
    return { pointer, step, index: index === -1 ? null : index, yOffset: touchOffset };
  }

  function handlePointerMove(event) {
    if (feedback || answerLock.current || !questionVisible || mode !== "create" || (selectedIndex != null && !touchPreviewRef.current?.active)) return;
    const { pointer, step, index } = getPointerIndex(event);
    if (index == null) return;
    setHoverIndex(index);

    if (touchPreviewRef.current?.active) {
      updateTouchPreview({ ...touchPreviewRef.current, active: true, x: pointer.x, y: pointer.y, step, index, dragged: true });
    }
  }

  function handlePointerDown(event) {
    if (feedback || answerLock.current || !questionVisible || mode !== "create") return;
    const { pointer, step, index, yOffset } = getPointerIndex(event, true);
    if (index == null) return;
    event.preventDefault();
    event.currentTarget.setPointerCapture?.(event.pointerId);
    setHoverIndex(index);
    updateTouchPreview({ active: true, x: pointer.x, y: pointer.y, step, index, yOffset, dragged: false });
  }

  function handlePointerUp(event) {
    if (feedback || answerLock.current || !questionVisible || mode !== "create") return;
    event.preventDefault();
    event.currentTarget.releasePointerCapture?.(event.pointerId);

    const preview=touchPreviewRef.current;
    if (preview?.index != null) {
      const index = getPointerIndex(event).index ?? preview.index;
      setSelectedIndex(index);
      setHoverIndex(index);
      setPrompt("");
    }

    updateTouchPreview(null);
  }

  function handlePointerCancel() {
    updateTouchPreview(null);
  }


  React.useEffect(() => () => clearFeedbackTimers(), []);

  return (
    <div className={SHELL.pageShellClass}>
      <window.MLH.AppHeader classroomOriginalFormat={!medalEligible || showHelp} profileState={{ activeLevel, enabledModes, showHelp }}
        icon={ASSET.appIcon}
        title="Intervals"
        subtitle="Identify and create intervals."
        worksheetConfig={() => ({
          version: 1,
          source: "activity",
          activityId: "intervals",
          activityName: "Intervals",
          level: LEVELS[activeLevel].label,
          profile: displayedLevelLabel,
          customised: !taskMatchesLevel(enabledModes),
          settings: { level: activeLevel, enabledModes: { ...enabledModes }, showHelp },
        })}
      >
        <ScorePanel activeLevel={activeLevel} correct={correct} attempted={attempted} accuracy={accuracy} streak={streak} bestStreak={bestStreak} confettiKey={confettiKey} resetScore={resetScore} medalEligible={medalEligible} />
      </window.MLH.AppHeader>

      <div className={SHELL.pageContentClass}>
        <main className={SHELL.mainShellClass} onPointerDown={() => {

          <div className="relative z-20 mb-2.5 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-2 overflow-visible">
            <div className="flex items-center gap-2 overflow-visible">

                <window.MLH.LevelButton
                  icon={<img src={ASSET.level} alt="" aria-hidden="true" className="h-[26px] w-[28px] object-contain scale-[1.06]" />}
                  activeLabel={displayedLevelLabel}
                  activeLevel={displayedLevel}
                  isCustom={!medalEligible}
                  onClick={() => {
                    setCustomiseOpen(false);
                    setLevelOpen((value) => !value);
                  }}
                />
                {levelOpen && (
                  <window.MLH.MenuPanel title="Level" position="left-0">
                    <window.MLH.LevelMenu activeLevel={activeLevel} onSelect={applyLevel} levels={LEVELS} />
                  </window.MLH.MenuPanel>

              <div className="relative" ref={customiseRef}>
                <window.MLH.CustomiseButton
                  icon={<img src={ASSET.customise} alt="" aria-hidden="true" className="h-[21px] w-[21px]" />}
                  onClick={() => {
                    setLevelOpen(false);
                    setCustomiseOpen((value) => !value);
                  }}
                />
                {customiseOpen && (
                  <window.MLH.MenuPanel title="Customise" position="-left-[66px] sm:left-0" variant="customise">
                    <MenuRows enabledModes={enabledModes} setEnabledModes={setEnabledModes} newQuestion={(nextModes) => newQuestion(nextModes, activeLevel)} showHelp={showHelp} setShowHelp={setShowHelp} activeLevel={activeLevel} />
                  </window.MLH.MenuPanel>

            </div>

            <div className="flex h-10 items-center justify-center">
              {feedback && <window.MLH.FeedbackBadge feedback={feedback} fading={feedbackFading} animationPrefix="note" />}
            </div>

            <window.MLH.SkipButton classroomAnswered={Boolean(feedback)} resetStreak={() => setStreak(0)} onClick={() => newQuestion(enabledModes, activeLevel)} icon={<img src={ASSET.next} alt="" aria-hidden="true" className="h-[27.8px] w-[27.8px] object-contain" />} />
          </div>

          <div className={`absolute inset-x-3 top-[92px] flex items-center justify-center overflow-hidden transition-opacity duration-300 sm:relative sm:inset-auto sm:-top-[55px] sm:block sm:overflow-visible ${mode === "identify" && question.typedMode ? "bottom-[206px]" : "bottom-[136px]"} ${questionVisible ? "opacity-100" : "opacity-0"}`}>
            <div className="w-full">
              <ScoreArea
                question={question}
                mode={mode}
                showHelp={showHelp}
                hoverIndex={hoverIndex}
                selectedIndex={selectedIndex}
                selectedAnswer={selectedAnswer}
                feedback={feedback}
                touchPreview={touchPreview}
                activeLevel={activeLevel}
                onPointerMove={handlePointerMove}
                onPointerDown={handlePointerDown}
                onPointerUp={handlePointerUp}
                disabled={!questionVisible}
                onKeyDown={event=>{if(feedback||answerLock.current||!questionVisible||event.repeat)return;if(["ArrowUp","ArrowDown","Enter"," ","Delete","Backspace"].includes(event.key)){event.preventDefault();if(["Delete","Backspace"].includes(event.key)){clearCreateAnswer();return;}const current=hoverIndex??selectedIndex??question.startIndex,index=clamp(current+(event.key==="ArrowUp"?1:event.key==="ArrowDown"?-1:0),noteIndexesForLevel(activeLevel)[0],noteIndexesForLevel(activeLevel).at(-1));setHoverIndex(index);if(event.key==="Enter"||event.key===" ")setSelectedIndex(index);}}}

          </div>

          <div className={`absolute bottom-[12px] left-3 right-3 z-10 flex flex-col overflow-hidden rounded-xl border border-stone-200 bg-stone-50 p-3 shadow-md sm:relative sm:bottom-auto sm:left-auto sm:right-auto sm:mt-3 sm:p-4 md:-mt-[168px] md:mx-3 ${mode === "identify" && question.typedMode ? "min-h-0 max-sm:pb-[17px]" : "min-h-[112px]"}`}>
            <div className="space-y-3 text-stone-900">

                        Clear
                      </button>
                      <window.MLH.ConfirmButton onClick={submitTypedAnswer} disabled={Boolean(feedback) || !typedAnswer.trim()}>Confirm</window.MLH.ConfirmButton>
                    </div>
                  </div>
                  {typedResult && <div className="shrink-0 whitespace-nowrap text-[1.05rem] font-semibold text-green-600 sm:ml-3">{typedResult}</div>}
                </div>
              )}

              <div className="absolute bottom-4 right-4 flex shrink-0 justify-end gap-2">
                {mode === "create" && (
                  <>
                    <button type="button" disabled={selectedIndex == null || Boolean(feedback)} onClick={clearCreateAnswer} className={window.MLH.ClearButtonClass}>
                      Clear
                    </button>
                    <window.MLH.ConfirmButton disabled={!canConfirm} onClick={confirmAnswer}>Confirm</window.MLH.ConfirmButton>
                  </>
                )}
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

function EscapeInterval({ activity }) {
  const embed = window.MLH.EscapeLiteracyActivity;
  const ref = embed.useContentHeight(activity);
  const level = activity.level === "N4" ? "N3" : activity.level;
  const question = embed.useQuestion(activity, () => createQuestion("identify", level));
  const writtenInterval = intervalNameFromHalfSteps(question.startIndex, question.endIndex, question.keySignature, question.targetAccidental, question.startAccidental);
  const correct = level === "N3" ? question.answer : level === "N5" ? (question.intervalSize === 8 ? "Octave" : semitoneDistance(question.startIndex, question.endIndex, question.keySignature, question.targetAccidental, question.startAccidental) === 1 ? "Semitone" : "Tone") : question.chromatic ? writtenInterval : question.answer;
  const labels = level === "N3" ? ["Step", "Leap"] : level === "N5" ? ["Semitone", "Tone", "Octave"]
    : question.chromatic ? ["Augmented 4th", "Diminished 5th", "Perfect 4th", "Perfect 5th", "Octave"]
    : intervalsForLevel(level).map(interval => interval.label);
  const choices = embed.numberedChoices(correct, labels, activity.clue.digit, level === "N3" ? 2 : level === "N5" ? 3 : 4);
  return (
    <main ref={ref} className="escape-literacy-content">
      <p className="escape-literacy-content-title">{level === "N3" ? question.prompt : "What is the interval between these two notes?"}</p>
      <div className="escape-literacy-short-score"><ScoreArea question={question} mode="identify" activeLevel={level} compact /></div>
      <embed.NumberedOptions activity={activity} choices={choices} columns={2} />
    </main>
  );
}

const escapeActivity = window.MLH.EscapeLiteracyActivity?.request("interval");
ReactDOM.createRoot(document.getElementById("root")).render(escapeActivity ? <EscapeInterval activity={escapeActivity} /> : <App />);

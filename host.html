function ClassroomLiteracyNotation({score}){

function ClassroomKeyboard({game,feedback,selection,enabled,onAnswer}){

  return <Score question={question.score} placements={[]} disabled showNoteNames={options?.showNoteNames}/>;
 }

  {question.type==='find'&&<WrittenNote note={question.note}/>}
  <Keyboard question={question} options={options} showC={showC===true} feedback={feedback}
    selected={selection?.pitch} showPendingSelection enabled={enabled}
    onSelect={key=>onAnswer(K.classroomKeyId(key.pitch))}/>
 </>;
}

const racePlayerKey=player=>player.id||player.name;
const isWordPuzzleRace=game=>game?.gameType==='activity-race'&&/^\/(wordsearch|crosswords)\.html(?:[?#]|$)/.test(game.activity);

function RaceLane({player,index,target,fault,countCorrect,unit,timed=false,elapsedMs,latestScore,finished,leading=false,showPlace=false}){

  <div className={`race-course${player.streak>=target?' complete':''}`} role="progressbar" aria-label={`${player.name}'s ${measure}`} aria-valuemin={0} aria-valuemax={target} aria-valuenow={streak} aria-valuetext={timed&&elapsedMs==null?'No submission':unit!==null?`${streak} of ${target} ${measure}`:undefined}>

function isWinnerRace(game){

const snakeColumns=40, snakeRows=21;
const snakeArrows={ArrowUp:[0,-1],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowRight:[1,0]};
const snakeControls=[['Up','↑'],['Left','←'],['Down','↓'],['Right','→']];
const snakeRhythms=[
 {glyph:'quarterNoteStemUp',beats:1,baseline:.87},
 {glyph:'halfNoteStemUp',beats:2,baseline:.87},
 {glyph:'wholeNote',beats:4,baseline:.5},
];

function snakeFood(body,hiddenCells=[]){
 const occupied=new Set([...body,...hiddenCells]);
 const free=Array.from({length:snakeColumns*snakeRows},(_,index)=>index).filter(index=>!occupied.has(index));
 if(!free.length)return null;
 const rhythm=snakeRhythms[Math.floor(Math.random()*snakeRhythms.length)];
 return {...rhythm,cell:free[Math.floor(Math.random()*free.length)]};
}

function newLobbySnake(direction=snakeArrows.ArrowRight,phase='ready',hiddenCells){
 const [dx,dy]=direction;
 const head=13*snakeColumns+10;
 const step=dy*snakeColumns+dx;
 const body=[head,head-step,head-2*step];
 return {body,food:snakeFood(body,hiddenCells),direction,queued:null,growth:0,phase};
}

function tickLobbySnake(game,hiddenCells){
 const direction=game.queued||game.direction;
 const [dx,dy]=direction;
 const head=game.body[0],x=head%snakeColumns+dx,y=Math.floor(head/snakeColumns)+dy;
 const next=((y+snakeRows)%snakeRows)*snakeColumns+(x+snakeColumns)%snakeColumns;
 const eating=next===game.food?.cell;
 const growth=game.growth+(eating?game.food.beats:0);
 // Add one square per move until all the collected beats have been counted.
 const remaining=growth>0?game.body:game.body.slice(0,-1);
 if(remaining.includes(next))return {...game,phase:'lost'};
 const body=[next,...remaining];
 const food=eating||!game.food?snakeFood(body,hiddenCells):game.food;
 return {body,food,direction,queued:null,growth:Math.max(0,growth-1),phase:'playing'};
}

function snakeCoveredCells(board,nameCard){
 if(!board.width||!board.height)return [];
 const noteOverhang=.25;
 const firstColumn=Math.max(0,Math.floor((nameCard.left-board.left)*snakeColumns/board.width-noteOverhang));
 const lastColumn=Math.min(snakeColumns,Math.ceil((nameCard.right-board.left)*snakeColumns/board.width+noteOverhang));
 const firstRow=Math.max(0,Math.floor((nameCard.top-board.top)*snakeRows/board.height-noteOverhang));
 const lastRow=Math.min(snakeRows,Math.ceil((nameCard.bottom-board.top)*snakeRows/board.height+noteOverhang));
 const covered=[];
 for(let row=firstRow;row<lastRow;row++){
  for(let column=firstColumn;column<lastColumn;column++)covered.push(row*snakeColumns+column);
 }
 return covered;
}

function LobbySnake({nameCard}){
 const [game,setGame]=useState(()=>newLobbySnake());
 const board=useRef(null),hiddenCells=useRef([]);
 const playing=game.phase==='playing';
 const started=game.phase!=='ready';
 useLayoutEffect(()=>{
  if(!started)return;
  const boardElement=board.current,nameElement=nameCard.current;
  const measure=()=>{
   const covered=snakeCoveredCells(boardElement.getBoundingClientRect(),nameElement.getBoundingClientRect());
   hiddenCells.current=covered;
   setGame(current=>!current.food||covered.includes(current.food.cell)
    ?{...current,food:snakeFood(current.body,covered)}
    :current);
  };
  measure();
  const observer=new ResizeObserver(measure);
  observer.observe(boardElement);
  observer.observe(nameElement);
  return()=>observer.disconnect();
 },[nameCard,started]);
 function steer(direction){
  setGame(current=>{
   if(current.phase!=='playing'||current.queued)return current;
   const [dx,dy]=direction;
   const [liveX,liveY]=current.direction;
   if(dx===-liveX&&dy===-liveY)return current;
   if(dx===liveX&&dy===liveY)return current;
   return {...current,queued:direction};
  });
 }
 useEffect(()=>{
  if(!playing)return;
  const handleArrow=event=>{
   const direction=snakeArrows[event.key];
   if(!direction||event.altKey||event.ctrlKey||event.metaKey||event.target.closest?.('input, textarea, select, [contenteditable]'))return;
   event.preventDefault();
   steer(direction);
  };
  window.addEventListener('keydown',handleArrow);
  return()=>window.removeEventListener('keydown',handleArrow);
 },[playing]);
 useEffect(()=>{
  if(!playing)return;
  const interval=window.setInterval(()=>setGame(current=>current.phase==='playing'?tickLobbySnake(current,hiddenCells.current):current),180);
  return()=>window.clearInterval(interval);
 },[playing]);
 const startGame=()=>setGame(newLobbySnake(snakeArrows.ArrowRight,'playing',hiddenCells.current));
 if(!started)return <section className="lobby-snake" data-started={false} aria-label="Snake">
  <p className="text-base font-medium text-stone-600">While you wait:</p>
  <button type="button" className="keyboard-answer primary" onClick={startGame}>Play Snake</button>
 </section>;
 const ended=game.phase==='lost';
 return <section className="lobby-snake" data-started={started} aria-label="Snake">
  <svg ref={board} className="lobby-snake-board" viewBox={`0 0 ${snakeColumns} ${snakeRows}`} preserveAspectRatio="none" aria-hidden="true">
   {game.body.map((cell,index)=><rect key={cell} x={cell%snakeColumns+.08} y={Math.floor(cell/snakeColumns)+.08} width=".84" height=".84" rx=".18" fill={index===0?'#000':'#404040'}/>)}
   {game.food&&<text x={game.food.cell%snakeColumns+.5} y={Math.floor(game.food.cell/snakeColumns)+game.food.baseline}
    textAnchor="middle" fontFamily="Bravura" fontSize="1.2" fill="#000">{BRAVURA_SYMBOLS[game.food.glyph]}</text>}
  </svg>

function AnimatedStandingScore({score,initialScore=0}){

  const start=value.current,delta=score-start;

  if(false){value.current=score;setDisplay(score);return;}
  let frame;const began=performance.now();
  function tick(now){const progress=Math.min(1,(now-began)/1500);const next=Math.round(start+delta*(1-Math.pow(1-progress,3)));value.current=next;setDisplay(next);if(progress<1)frame=requestAnimationFrame(tick);}
  frame=requestAnimationFrame(tick);return()=>cancelAnimationFrame(frame);
 },[score]);
 return <span className="classroom-standing-score">{display}</span>;
}

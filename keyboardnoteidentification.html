<script type="text/x-mlh-jsx-source" data-runtime="keyboardnoteidentification-1.js">
const {useState, useRef, useEffect} = React;
const K = window.KeyboardNotes;
const LEVELS = Object.fromEntries(Object.entries({N3:'National 3',N4:'National 4',N5:'National 5',H:'Higher',AH:'Advanced Higher'}).map(([id,label])=>[id,{label,description: K.subtitles[id]}]));
const ASSET = {appIcon:'./app-icons/keyboard-icon.svg',level:'./ui-icons/levels.svg',customise:'./ui-icons/customise.svg',next:'./ui-icons/next.svg',bronze:'./ui-icons/bronze.svg',silver:'./ui-icons/silver.svg',gold:'./ui-icons/gold.svg',diamond:'./ui-icons/diamond.svg'};
const MEDAL_THRESHOLDS = [10,15,20,30];
function classroomReturnSettings(){try{return K.classroomSettings(JSON.parse(new URLSearchParams(location.search).get('classroomSetup')));}catch{return null;}}
function initialLevel(){const restored=classroomReturnSettings();if(restored)return restored.level;const requested=new URLSearchParams(location.search).get('level');return LEVELS[requested]?requested:'N3';}
const Keyboard = window.MLH.KeyboardNoteKeyboard;
const WrittenNote = window.MLH.KeyboardWrittenNote;
function NoteGroupGlyph({type}){
  const symbols=window.BRAVURA_SYMBOLS;
  const names=type==='enharmonics'?['sharp','flat']:[type==='naturals'?'natural':type==='sharps'?'sharp':'flat'];
  return <span aria-hidden="true" className="inline-flex h-[22px] w-[28px] items-center justify-center gap-[3px] text-black">{names.map(name=><span key={name} className={`music-symbol relative leading-none ${name==='flat'?'top-[2px] text-[23px]':'top-[1px] text-[21px]'}`}>{symbols[name]}</span>)}</span>;
}
function App(){
  const [level,setLevel]=useState(initialLevel);
  const [showC,setShowC]=window.MLH.useProfileState("showC", ()=>classroomReturnSettings()?.showC||false);
  const [savedOptions,setOptions]=window.MLH.useProfileState("options", ()=>({...classroomReturnSettings()?.options||K.defaults[initialLevel()]}));
  const [savedTypes,setQuestionTypes]=window.MLH.useProfileState("questionTypes", ()=>({name:!["H","AH"].includes(initialLevel()),find:["H","AH"].includes(initialLevel())}));
  const options=K.normaliseOptions(savedOptions,level),questionTypes=K.normaliseTypes(savedTypes,level);
  const questionGenerator=useRef(null);if(!questionGenerator.current)questionGenerator.current=K.create(Math.random);
  const [question,setQuestion]=useState(()=>questionGenerator.current.next(options,questionTypes,level));
  const [questionVisible,setQuestionVisible]=useState(true);
  const [selected,setSelected]=useState(null),[feedback,setFeedback]=useState(null),[fading,setFading]=useState(false);
  const [levelOpen,setLevelOpen]=useState(false),[customiseOpen,setCustomiseOpen]=useState(false);
  const [confetti,setConfetti]=useState(0),[autoShowMedals,setAutoShowMedals]=useState(false);
  const context={level,settings:{questions:{...Object.fromEntries(Object.entries(options).filter(([key])=>key!=='octaves')),questionTypes}, ...(showC?{options:{showC:true}}:{})}};
  const [correct,setCorrect]=window.MLH.usePersistentScoreState(0,'correct',context);
  const [attempted,setAttempted]=window.MLH.usePersistentScoreState(0,'attempted',context);
  const [streak,setStreak]=window.MLH.usePersistentScoreState(0,'streak',context);
  const [best,setBest]=window.MLH.usePersistentScoreState(0,'best',context);
  const levelRef=useRef(null),customiseRef=useRef(null),timers=useRef([]),answerLock=useRef(false);
  window.MLH.useClickOutside([levelRef,customiseRef],[()=>setLevelOpen(false),()=>setCustomiseOpen(false)]);
  function clearTimers(){timers.current.forEach(clearTimeout);timers.current=[];}
  useEffect(()=>()=>clearTimers(),[]);
  const medalEligible=Object.keys(options).every(key=>options[key]===K.defaults[level][key]);
  const answers=K.answers(options);
  function next(nextOptions=options,nextTypes=questionTypes,nextLevel=level){
    clearTimers();answerLock.current=true;setQuestionVisible(false);setFading(true);setAutoShowMedals(false);
    timers.current.push(setTimeout(()=>{
      setQuestion(current=>questionGenerator.current.next(nextOptions,nextTypes,nextLevel,current.baseOctave != null ? `${current.baseOctave}:${current.pitch}:${current.note.clef}` : current.pitch));setSelected(null);setFeedback(null);setFading(false);setQuestionVisible(true);answerLock.current=false;
    },260));
  }
  function applyLevel(id){const url=new URL(location.href);url.searchParams.delete("classroomSetup");url.searchParams.set("level",id);history.replaceState(null,"",url);const values={...K.defaults[id]};setLevel(id);setOptions(values);const types={name:!["H","AH"].includes(id),find:["H","AH"].includes(id)};setQuestionTypes(types);setShowC(false);setConfetti(0);setLevelOpen(false);setCustomiseOpen(false);next(values,types,id);}
  function toggle(key){if(!['N5','H','AH'].includes(level)||key==='naturals')return;const values={...options,[key]:!options[key]};if(!K.answers(values).length || (['H','AH'].includes(level)&&!values.treble&&!values.bass))return;setOptions(values);setConfetti(0);next(values);}
  function toggleQuestionType(type){const nextTypes={...questionTypes,[type]:!questionTypes[type]};if(!Object.values(nextTypes).some(Boolean))return;setQuestionTypes(nextTypes);setConfetti(0);next(options,nextTypes);}
  function reset(){clearTimers();setCorrect(0);setAttempted(0);setStreak(0);setBest(0);setConfetti(0);next();}
  function submit(answer){
    if(answerLock.current||feedback||!questionVisible)return;
    answerLock.current=true;
    const ok=question.type === "find" ? answer.pitch === question.pitch : K.correct(answer,question), count=ok?streak+1:0;
    setSelected(question.type === "find" ? answer.pitch : answer.id);setAttempted(value=>value+1);setCorrect(value=>value+(ok?1:0));setStreak(count);setBest(value=>Math.max(value,count));setFeedback({correct:ok});
    window.MLH?.playFeedbackSound?.(ok);
    if(ok){
      if(medalEligible&&MEDAL_THRESHOLDS.includes(count)){setConfetti(value=>value+1);setAutoShowMedals(true);const sound=window.MLH?.getStreakMedal?.(count)?.sound;timers.current.push(setTimeout(()=>window.MLH?.playFeedbackSound?.(true,true,sound),180));}
      timers.current.push(setTimeout(()=>setFading(true),1700));timers.current.push(setTimeout(()=>next(),2000));
    }
  }
  return <div className={window.MLH.shell.pageShellClass}>
    <window.MLH.AppHeader profileState={{ level, showC, options, questionTypes }} icon={ASSET.appIcon} title="Keyboard Note Identification" subtitle="Identify notes on the keyboard and match written notes to keys." classroomPilotUrl="./keyboardnoteidentificationclassroom.html" classroomPilotConfig={() => ({level,options,showC})} worksheetConfig={() => ({ version: 1, activityId: "keyboard-notes", sourceUrl: window.location.href, settings: { level, options, showC, questionTypes } })}>
      <window.MLH.ScoreStreakPanel achievementLevel={level} assets={ASSET} correct={correct} attempted={attempted} accuracy={attempted?Math.round(correct/attempted*100):0} streak={streak} bestStreak={best} resetScore={reset} confettiKey={confetti} autoShowMedals={autoShowMedals} medalEligible={medalEligible} medalThresholdValues={MEDAL_THRESHOLDS}/>
    </window.MLH.AppHeader>
    <div className={window.MLH.shell.pageContentClass}><main className={window.MLH.shell.mainShellClass} onPointerDown={event=>{if(feedback&&questionVisible&&!event.target.closest('button,input,[data-menu-trigger],[data-menu-panel]'))next();}}>
      <div className="hub-toolbar relative z-20">
        <div className="hub-toolbar-left">
          <div className="hub-menu-anchor relative" ref={levelRef}>
            <window.MLH.LevelButton icon={<img src={ASSET.level} alt="" className="h-[26px] w-[28px]"/>} activeLevel={medalEligible?level:'Custom'} activeLabel={medalEligible?LEVELS[level].label:'Custom'} isCustom={!medalEligible} onClick={()=>{setCustomiseOpen(false);setLevelOpen(value=>!value);}} dataMenuTrigger={true}/>
            {levelOpen&&<window.MLH.MenuPanel title="Level" position="left-0" dataMenuPanel={true}><window.MLH.LevelMenu activeLevel={level} onSelect={applyLevel} levels={LEVELS}/></window.MLH.MenuPanel>}
          </div>
          <div className="hub-menu-anchor relative" ref={customiseRef}>
            <window.MLH.CustomiseButton icon={<img src={ASSET.customise} alt="" className="h-[26px] w-[26px]"/>} onClick={()=>{setLevelOpen(false);setCustomiseOpen(value=>!value);}} dataMenuTrigger={true}/>
            {customiseOpen&&<window.MLH.MenuPanel title="Customise" position="left-0" variant="customise" dataMenuPanel={true}>
              {!['H','AH'].includes(level) && <><window.MLH.MenuSubheading>Question Types</window.MLH.MenuSubheading>
              {Object.entries({name:'Name the Key',find:'Find the Key'}).map(([type,label])=><window.MLH.MenuToggleRow key={type} glyph={type==='name' ? <img src="./ui-icons/keyboard.svg" alt="" aria-hidden="true" className="h-[22px] w-[22px] object-contain"/> : <span aria-hidden="true" className="inline-flex h-[22px] w-[28px] items-center justify-center text-black"><span className="music-symbol relative top-[3px] text-[17px] leading-none">{window.BRAVURA_SYMBOLS.gClef}</span></span>} label={label} checked={questionTypes[type]} disabled={questionTypes[type]&&Object.values(questionTypes).filter(Boolean).length===1} onChange={()=>toggleQuestionType(type)}/>)}</>}
              {['H','AH'].includes(level)&&<><window.MLH.MenuSubheading>Clefs</window.MLH.MenuSubheading>{['treble','bass'].map(clef=><window.MLH.MenuToggleRow key={clef} glyph={<span className="music-symbol relative top-[3px] text-[18px]">{window.BRAVURA_SYMBOLS[clef==='treble'?'gClef':'fClef']}</span>} label={clef==='treble'?'Treble Clef':'Bass Clef'} checked={options[clef]} disabled={options[clef]&&!options[clef==='treble'?'bass':'treble']} onChange={()=>toggle(clef)}/>)}</>}
              <window.MLH.MenuSubheading>Help</window.MLH.MenuSubheading>
              <window.MLH.MenuToggleRow glyph={<img src="./ui-icons/guide.svg" alt="" aria-hidden="true" className="h-[22px] w-[22px] object-contain"/>} label="Guide Note" checked={showC} onChange={()=>setShowC(value=>!value)}/>
              {['N5','H','AH'].includes(level)&&<><window.MLH.MenuSubheading>Note names</window.MLH.MenuSubheading>
              {Object.entries(['H','AH'].includes(level)?{sharps:'Sharps',flats:'Flats'}:{sharps:'Sharps',flats:'Flats',enharmonics:'E♯, B♯, C♭ and F♭'}).filter(([key])=>key!=='enharmonics'||level==='N5').map(([key,label])=><window.MLH.MenuToggleRow key={key} glyph={<NoteGroupGlyph type={key}/>} label={label} checked={options[key]} disabled={key==='enharmonics'?!(options.sharps||options.flats):!K.answers({...options,[key]:false}).length} onChange={()=>toggle(key)}/>)}</>}
            </window.MLH.MenuPanel>}
          </div>
        </div>
        <div className="hub-toolbar-feedback" aria-live="polite"><window.MLH.FeedbackBadge feedback={feedback} fading={fading} animationPrefix="note"/></div>
        <div className="hub-toolbar-right"><window.MLH.SkipButton resetStreak={()=>setStreak(0)} onClick={()=>next()} icon={<img src={ASSET.next} alt="" className="h-[27.8px] w-[27.8px]"/>}/></div>
      </div>
      <div className="keyboard-question-transition" style={{opacity:questionVisible?1:0}}>{question.type==="find"&&<WrittenNote note={question.note}/>}<div className="keyboard-area"><Keyboard question={question} feedback={feedback} options={options} showC={showC} selected={selected} enabled={!feedback&&questionVisible} onSelect={submit}/></div></div>
      <div className="chords-question-card relative z-10 mx-3 overflow-hidden rounded-xl border border-stone-200 bg-stone-50 p-4 shadow-md">
        <p className="text-base font-semibold leading-tight">{question.type === "find" ? "Select the written note on the keyboard." : <>Identify the highlighted <strong>note</strong>.</>}</p>
        {question.type === "name" && <div className="keyboard-answers">{[1,0,-1].filter(offset=>answers.some(answer=>answer.offset===offset)).flatMap(offset=>K.letters.map((letter,index)=>{const answer=answers.find(item=>item.offset===offset&&item.index===index);return answer?<button type="button" key={answer.id} disabled={Boolean(feedback)||!questionVisible} aria-pressed={selected===answer.id} aria-label={answer.id.replace('#',' sharp').replace('b',' flat')} onClick={event=>{event.currentTarget.blur();submit(answer);}} className={`keyboard-answer ${answer.offset?'accidental':''} ${feedback&&(K.correct(answer,question)?'correct':selected===answer.id?'incorrect':'')}`}>{answer.offset?<span className="flex items-center justify-center gap-[3px]"><span>{letter}</span><span className={`music-symbol relative inline-block leading-none ${answer.offset===1?'top-[1px] text-[1.1em]':'top-[2px] text-[1.15em]'}`}>{window.BRAVURA_SYMBOLS[answer.offset===1?'sharp':'flat']}</span></span>:letter}</button>:<div className="keyboard-empty" key={`${letter}:${offset}`} aria-hidden="true"/>;}))}</div>}
      </div>
    </main></div>
  </div>;
}
function EscapeKeyboardName({ activity }) {
  const embed = window.MLH.EscapeLiteracyActivity;
  const ref = embed.useContentHeight(activity);
  const options = { ...K.defaults[activity.level], naturals: true, sharps: false, flats: false };
  const question = embed.useQuestion(activity, () => K.create().next(options, { name: true }));
  const correct = K.answers(options).find(answer => K.correct(answer, question)).label;
  return (
    <main ref={ref} className="escape-literacy-content">
      <p className="escape-literacy-content-title">Identify the highlighted note.</p>
      <div className="mb-5 flex justify-center"><Keyboard question={question} options={options} /></div>
      <embed.NumberedOptions activity={activity} choices={embed.codeOrder(K.letters, correct, activity.clue.digit)} />
    </main>
  );
}
const escapeActivity = window.MLH.EscapeLiteracyActivity?.request("keyboardNote");
ReactDOM.createRoot(document.getElementById('root')).render(escapeActivity ? <EscapeKeyboardName activity={escapeActivity} /> : <App/>);

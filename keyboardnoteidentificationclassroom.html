<script type="text/x-mlh-jsx-source" data-runtime="keyboardnoteidentificationclassroom-1.js">
const {useState,useRef,useEffect,useLayoutEffect}=React;
const K=window.KeyboardNotes;

  let cancelled=false;

   context.font='1000px Bravura';
   const b=context.measureText(glyph);
   const width=b.actualBoundingBoxLeft+b.actualBoundingBoxRight;
   const height=b.actualBoundingBoxAscent+b.actualBoundingBoxDescent;
   if(width&&height)setBox(`${-b.actualBoundingBoxLeft} ${-b.actualBoundingBoxAscent} ${width} ${height}`);

  return()=>{cancelled=true;};

 return <><span className="participant-symbol" aria-hidden="true"><svg viewBox={box} preserveAspectRatio="xMidYMid meet"><text ref={glyphRef} className="music-symbol" x="0" y="0" fontSize="1000" fill="currentColor">{glyph}</text></svg></span><span className="participant-name-text">{name}</span></>;
}
function Keyboard({question,feedback,options,showC}){
  const width=options.octaves===1?336:672;
  return <svg className="keyboard-score" width={width} viewBox={`-1 -1 ${width+2} 252`} role="img" aria-label="Piano keyboard with one key highlighted. Identify the highlighted note.">
    {K.visibleKeys(options).filter(key=>!key.black).map(key=><rect key={key.pitch} x={key.x} y="0" width="48" height="248" rx="5" fill={key.pitch===question.pitch?(feedback?(feedback.correct?'#16a34a':'#dc2626'):'#2563eb'):'#fff'} stroke="#78716c"/>)}

    {showC&&K.visibleKeys(options).filter(key=>!key.black&&key.pitch%12===0).map(key=><text key={`label-${key.pitch}`} x={key.x+24} y="225" textAnchor="middle" fontSize="17" fontWeight="700" fill={key.pitch===question.pitch?'white':'#57534e'} pointerEvents="none">C</text>)}
  </svg>;
}

function AnswerChoices({answers,question,review,selected,disabled,onAnswer}){
 return <div className="keyboard-answers">{[1,0,-1].filter(offset=>answers.some(answer=>answer.offset===offset)).flatMap(offset=>K.letters.map((letter,index)=>{
  const answer=answers.find(item=>item.offset===offset&&item.index===index);

 }))}</div>;
}
const racePlayerKey=player=>player.id||player.name;
function RaceLane({player,index,target,fault}){

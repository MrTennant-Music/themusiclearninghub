    <div className="chords-question-card relative z-10 mt-6 flex flex-col rounded-xl border border-stone-200 bg-stone-50 px-4 py-4 shadow-md mx-3"><div><p className="text-base font-semibold leading-tight">{promptForQuestion(question, fullPassage)}</p>{prompt&&<p className="mt-2 text-sm font-bold text-red-600">{prompt}</p>}<div className="mt-2">{question.mode==="choice"?<div className="flex flex-col gap-3"><div className={`grid gap-2 ${question.options.length <= 2 ? "w-1/2 grid-cols-2" : question.options.length === 3 ? "w-full grid-cols-3" : question.options.length === 5 ? "w-full grid-cols-5" : question.options.length === 6 ? "w-full grid-cols-3" : "w-full grid-cols-4"}`}>{question.options.map(id=><button key={id} disabled={Boolean(feedback) || !questionVisible} onClick={()=>{setSelected(id);score(isCorrectChoice(id, question));}} className={answerButtonClass(id)}><AnswerOptionLabel id={id}/></button>)}</div><button type="button" onClick={play} disabled={!questionVisible || feedback?.correct === true} className={window.MLH.PlayButtonClass}><span className={`hub-playback-glyph ${playing ? "is-stop" : "is-play"}`} aria-hidden="true"></span><span>{playing?"Stop":"Play"}</span></button></div>:<div className="flex flex-wrap items-center gap-3"><input value={typed} disabled={Boolean(feedback) || !questionVisible} onChange={e=>setTyped(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!disabledConfirm){e.preventDefault();confirm();}}} placeholder="Type your answer" className={window.MLH.typedAnswerClass(feedback?{correct:isCorrectText(typed,question)}:null,"w-1/2")}/>{feedback&&!feedback.correct&&<div className="text-base font-bold text-green-600">{answerLabelForQuestion(question)}</div>}</div>}</div></div>{question.mode==="text"&&<div className={window.MLH.PlayClearConfirmRowClass}><button type="button" onClick={play} disabled={!questionVisible || feedback?.correct === true} className={window.MLH.PlayButtonClass}><span className={`hub-playback-glyph ${playing ? "is-stop" : "is-play"}`} aria-hidden="true"></span><span>{playing?"Stop":"Play"}</span></button><div className={window.MLH.ActionButtonGroupClass}><button type="button" disabled={Boolean(feedback) || !questionVisible || !typed.trim()} onClick={clearAnswer} className={window.MLH.ClearButtonClass}>Clear</button><window.MLH.ConfirmButton disabled={disabledConfirm} onClick={confirm} className={window.MLH.AudioConfirmButtonClass}>Confirm</window.MLH.ConfirmButton></div></div>}</div></div>
    </>}</main></div></div>;
}
function makeEscapeEarTrainingClue({level, clue}, randomize) {
  const enabled = availableConceptIdsForLevel(level);
  const topics = randomize(topicsForLevel(level).filter(topic => !MERGED_SUBTOPICS.has(topic)), clue.seed);
  const topic = topics[clue.slot];
  const question = prepareQuestion(buildQuestion(level, enabled, topic), clue.seed + clue.slot);
  // The standalone activity sometimes accepts two names for the same heard result.
  // Use a single choice for that result so only one digit opens the door.
  const correct = question.options.includes(question.answerId) ? question.answerId
    : question.options.find(id => isCorrectChoice(id, question)) ?? question.answerId;
  const wrong = question.options.filter(id => !isCorrectChoice(id, question));
  const choices = randomize([correct, ...wrong], clue.seed + clue.slot + 1);
  const digits = randomize([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(digit => digit !== clue.digit), clue.seed + clue.slot + 2);
  return {question, choices: choices.map(id => ({id, digit: id === correct ? clue.digit : digits.shift()}))};
}

function EscapeEarTraining({activity}) {
  const embed = window.MLH.EscapeLiteracyActivity;
  const ref = embed.useContentHeight(activity);
  const {question, choices} = embed.useQuestion(activity, current => {
    const core = window.parent.EscapeCore;
    return makeEscapeEarTrainingClue(current, (items, seed) => core.shuffle(items, core.random(seed)));
  });
  const timers = useRef([]);
  const [prompt, setPrompt] = useState("");
  const {play, playing} = useEarTrainingPlayback({
    activity, question, tempo:question.playbackTempo, fullPassage:true, timers, setPrompt,
  });
  return <main ref={ref} className="escape-literacy-content">
    <embed.AudioHeader activity={activity} prompt={promptForQuestion(question, true)} onPlay={play} playing={playing} />
    <embed.NumberedOptions activity={activity} choices={choices.map(({id}) => <AnswerOptionLabel id={id} />)} digits={choices.map(({digit}) => digit)} columns={2} />
    {prompt && <p role="status">{prompt}</p>}
  </main>;
}

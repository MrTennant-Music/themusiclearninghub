  <script type="text/x-mlh-jsx-source" data-runtime="triplets-1.js">
const { useEffect, useMemo, useRef, useState } = React;

const SVG = { width: 920, height: 420 };

const STAFF = {
  left: 24,
  right: 896,
  tops: [92, 217],
  gap: 10,
};

const BAR_COUNT = 8;
const BARS_PER_SYSTEM = 4;
const CLEF_X = STAFF.left + 8;
const KEY_SIGNATURE_X = STAFF.left + 56;
const KEY_SIGNATURE_SPACING = 14;
const TIME_SIG_X = STAFF.left + 112;
const MUSIC_START_X = STAFF.left + 152;

const NOTE = {
  rx: 6.3,
  ry: 4.6,
  stemLength: 32,
};

const COLOUR = {
  green: "#16a34a",
  red: "#dc2626",
  black: "#000000",
};

const ASSET = {
  appIcon: "app-icons/triplets-icon.svg",
  levels: "ui-icons/levels.svg",
  customise: "ui-icons/customise.svg",
  next: "ui-icons/next.svg",
  bronze: "ui-icons/bronze.svg",
  silver: "ui-icons/silver.svg",
  gold: "ui-icons/gold.svg",
  diamond: "ui-icons/diamond.svg",
};

const LEVELS = {
  H: { label: "Higher", shortLabel: "H", description: "Triplet quavers, triplet crotchets" },
};

const NOTE_POOL = [
  { name: "C4", step: -2 },
  { name: "D4", step: -1 },
  { name: "E4", step: 0 },
  { name: "F4", step: 1 },
  { name: "G4", step: 2 },
  { name: "A4", step: 3 },
  { name: "B4", step: 4 },
  { name: "C5", step: 5 },
  { name: "D5", step: 6 },
  { name: "E5", step: 7 },
  { name: "F5", step: 8 },
  { name: "G5", step: 9 },
  { name: "A5", step: 10 },
];

const TIME_SIGNATURES = [
  { id: "2/4", top: "2", bottom: "4", beats: 2 },
  { id: "3/4", top: "3", bottom: "4", beats: 3 },
  { id: "4/4", top: "4", bottom: "4", beats: 4 },
];

const KEYS = [
  { id: "C", label: "C major", signature: [] },
  { id: "G", label: "G major", signature: [{ type: "sharp", step: 8 }] },
  { id: "Am", label: "A minor", signature: [] },
  { id: "F", label: "F major", signature: [{ type: "flat", step: 4 }] },
];

const TRIPLET_TYPES = [
  {
    id: "quaver-triplet",
    label: "Quaver triplet",
    rhythm: "triplet-quaver",
    beats: 1,
    usesBracket: false,
  },
  {
    id: "crotchet-triplet",
    label: "Crotchet triplet",
    rhythm: "triplet-crotchet",
    beats: 2,
    usesBracket: true,
  },
];

const RHYTHMS = {
  semibreve: { beats: 4, spacing: 8, open: true, stem: false, dot: false, flag: false },
  "dotted-minim": { beats: 3, spacing: 6, open: true, stem: true, dot: true, flag: false },
  minim: { beats: 2, spacing: 4, open: true, stem: true, dot: false, flag: false },
  crotchet: { beats: 1, spacing: 2.2, open: false, stem: true, dot: false, flag: false },
  quaver: { beats: 0.5, spacing: 1.15, open: false, stem: true, dot: false, flag: true },
  "triplet-quaver": { beats: 1 / 3, spacing: 0.95, open: false, stem: true, dot: false, flag: true },
  "triplet-crotchet": { beats: 2 / 3, spacing: 1.5, open: false, stem: true, dot: false, flag: false },
};

const FILL_PATTERNS = {
  0: [[]],
  1: [["crotchet"], ["quaver", "quaver"]],
  2: [["minim"], ["crotchet", "crotchet"], ["quaver", "quaver", "crotchet"], ["crotchet", "quaver", "quaver"]],
  3: [["dotted-minim"], ["minim", "crotchet"], ["crotchet", "minim"], ["crotchet", "crotchet", "crotchet"], ["quaver", "quaver", "crotchet", "crotchet"]],
  4: [["semibreve"], ["minim", "minim"], ["minim", "crotchet", "crotchet"], ["crotchet", "crotchet", "minim"], ["crotchet", "crotchet", "crotchet", "crotchet"], ["quaver", "quaver", "crotchet", "crotchet", "crotchet"]],
};

const QUAVER_TEXTURE_PATTERNS = {
  0: [[]],
  1: [["quaver", "quaver"], ["crotchet"]],
  2: [["quaver", "quaver", "quaver", "quaver"], ["quaver", "quaver", "crotchet"], ["crotchet", "quaver", "quaver"]],
  3: [["quaver", "quaver", "quaver", "quaver", "crotchet"], ["quaver", "quaver", "crotchet", "quaver", "quaver"], ["crotchet", "quaver", "quaver", "crotchet"]],
  4: [["quaver", "quaver", "quaver", "quaver", "crotchet", "crotchet"], ["quaver", "quaver", "crotchet", "quaver", "quaver", "crotchet"], ["crotchet", "quaver", "quaver", "crotchet", "quaver", "quaver"]],
};

const CROTCHET_TEXTURE_PATTERNS = {
  0: [[]],
  1: [["crotchet"]],
  2: [["minim"], ["crotchet", "crotchet"]],
  3: [["dotted-minim"], ["minim", "crotchet"], ["crotchet", "minim"], ["crotchet", "crotchet", "crotchet"]],
  4: [["semibreve"], ["minim", "minim"], ["minim", "crotchet", "crotchet"], ["crotchet", "crotchet", "minim"], ["crotchet", "crotchet", "crotchet", "crotchet"]],
};

function randomIndex(length) {
  return Math.floor(Math.random() * length);
}

function randomItem(items) {
  return items[randomIndex(items.length)];
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function rhythmInfo(rhythm) {
  return RHYTHMS[rhythm] || RHYTHMS.crotchet;
}

function yForStep(systemTop, step) {
  return systemTop + STAFF.gap * 4 - step * (STAFF.gap / 2);
}

function stepForIndex(index) {
  return NOTE_POOL[clamp(index, 0, NOTE_POOL.length - 1)].step;
}

function noteLetterForIndex(index) {
  return NOTE_POOL[clamp(index, 0, NOTE_POOL.length - 1)].name[0];
}

function melodicAccidentalForLetter(key, letter) {
  return key?.id === "Am" && letter === "G" ? 1 : null;
}

function applyWrittenAccidentals(notes, key) {
  const shownAccidentals = new Set();
  return notes.map((note) => {
    const accidental = melodicAccidentalForLetter(key, note.letter);
    if (accidental === null) return { ...note, writtenAccidental: null };
    const accidentalKey = `${note.step}:${accidental}`;
    const writtenAccidental = shownAccidentals.has(accidentalKey) ? null : accidental;
    shownAccidentals.add(accidentalKey);
    return { ...note, writtenAccidental };
  });
}

function stemGoesDown(step) {
  return step > 4;
}

function nextMelodicIndex(previousIndex, stepwise = false) {
  const move = stepwise ? randomItem([-1, 1]) : randomItem([-2, -1, 0, 0, 1, 2]);
  return clamp(previousIndex + move, 0, NOTE_POOL.length - 1);
}

function avoidFirstNoteMelodicAccidental(index, key) {
  if (!melodicAccidentalForLetter(key, noteLetterForIndex(index))) return index;
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const replacement = nextMelodicIndex(index, false);
    if (!melodicAccidentalForLetter(key, noteLetterForIndex(replacement))) return replacement;
    index = replacement;
  }
  return index;
}

function getFillPattern(beats, texture) {
  const roundedBeats = Math.round(beats);
  const preferred = texture === "quaver" ? QUAVER_TEXTURE_PATTERNS[roundedBeats] : CROTCHET_TEXTURE_PATTERNS[roundedBeats];
  const fallback = FILL_PATTERNS[roundedBeats] || [["crotchet"]];
  const pool = preferred && Math.random() < 0.82 ? preferred : fallback;
  return randomItem(pool);
}

function makeNotesFromRhythms(rhythms, previousIndex, barIndex, targetGroupId = null, targetRhythm = null, key = null) {
  let index = previousIndex;
  const notes = rhythms.map((rhythm, noteIndex) => {
    const isStepwise = rhythm.includes("triplet") || rhythm === "quaver";
    index = nextMelodicIndex(index, isStepwise);
    if (noteIndex === 0) index = avoidFirstNoteMelodicAccidental(index, key);
    return {
      id: `${barIndex}-${noteIndex}`,
      rhythm,
      letter: noteLetterForIndex(index),
      step: stepForIndex(index),
      writtenAccidental: null,
      targetGroupId: rhythm === targetRhythm ? targetGroupId : null,
    };
  });
  return { notes: applyWrittenAccidentals(notes, key), nextIndex: index };
}

function makeTargetBar(timeSignature, tripletType, previousIndex, barIndex, key) {
  const remainingBeats = timeSignature.beats - tripletType.beats;
  const texture = tripletType.id === "quaver-triplet" ? "quaver" : "crotchet";
  const beforeBeats = randomIndex(remainingBeats + 1);
  const before = getFillPattern(beforeBeats, texture);
  const after = getFillPattern(remainingBeats - beforeBeats, texture);
  const tripletPattern = [tripletType.rhythm, tripletType.rhythm, tripletType.rhythm];
  const rhythms = [...before, ...tripletPattern, ...after];
  const targetGroupId = `target-${barIndex}`;
  const made = makeNotesFromRhythms(rhythms, previousIndex, barIndex, targetGroupId, tripletType.rhythm, key);
  return { notes: made.notes, nextIndex: made.nextIndex, targetGroupId };
}

function makeNormalBar(timeSignature, previousIndex, texture, barIndex, key) {
  const fillPattern = getFillPattern(timeSignature.beats, texture);
  const made = makeNotesFromRhythms(fillPattern, previousIndex, barIndex, null, null, key);
  return { notes: made.notes, nextIndex: made.nextIndex, targetGroupId: null };
}

function createQuestion(barCount = BAR_COUNT) {
  const timeSignature = randomItem(TIME_SIGNATURES);
  const key = randomItem(KEYS);
  const tripletType = randomItem(TRIPLET_TYPES.filter((type) => type.beats <= timeSignature.beats));
  const targetBarIndex = randomIndex(barCount);
  const texture = tripletType.id === "quaver-triplet" ? "quaver" : "crotchet";
  const bars = [];
  let previousIndex = randomIndex(NOTE_POOL.length);

  for (let barIndex = 0; barIndex < barCount; barIndex += 1) {
    const bar = barIndex === targetBarIndex
      ? makeTargetBar(timeSignature, tripletType, previousIndex, barIndex, key)
      : makeNormalBar(timeSignature, previousIndex, texture, barIndex, key);
    bars.push(bar);
    previousIndex = bar.nextIndex;
  }

  const targetGroupId = `target-${targetBarIndex}`;
  const targetNoteIds = bars[targetBarIndex].notes
    .filter((note) => note.targetGroupId === targetGroupId)
    .map((note) => note.id);

  return {
    id: Math.random().toString(36).slice(2),
    key,
    timeSignature,
    tripletType,
    targetBarIndex,
    targetGroupId,
    targetNoteIds,
    bars,
  };
}

function getBarNotePositions(notes, startX, endX) {
  const units = notes.reduce((sum, note) => sum + rhythmInfo(note.rhythm).spacing, 0);
  const unitWidth = Math.max(1, endX - startX) / Math.max(1, units);
  let cursor = startX + unitWidth * 0.35;
  return notes.map((note) => {
    const x = cursor;
    cursor += rhythmInfo(note.rhythm).spacing * unitWidth;
    return x;
  });
}

function buildLayouts(question) {
  const layouts = [];
  STAFF.tops.slice(0, Math.ceil(question.bars.length / BARS_PER_SYSTEM)).forEach((systemTop, systemIndex) => {
    const barWidth = (STAFF.right - MUSIC_START_X) / BARS_PER_SYSTEM;
    for (let localBarIndex = 0; localBarIndex < BARS_PER_SYSTEM; localBarIndex += 1) {
      const barIndex = systemIndex * BARS_PER_SYSTEM + localBarIndex;
      const startX = MUSIC_START_X + localBarIndex * barWidth;
      const endX = MUSIC_START_X + (localBarIndex + 1) * barWidth;
      const bar = question.bars[barIndex];
      layouts.push({
        barIndex,
        bar,
        systemTop,
        startX,
        endX,
        positions: getBarNotePositions(bar.notes, startX + 8, endX - 8),
      });
    }
  });
  return layouts;
}

function getStemData(note, x, systemTop, forcedStemDown = null) {
  const y = yForStep(systemTop, note.step);
  const down = forcedStemDown === null ? stemGoesDown(note.step) : forcedStemDown;
  const stemX = down ? x - NOTE.rx : x + NOTE.rx;
  const stemEndY = down ? y + NOTE.stemLength : y - NOTE.stemLength;
  return { y, down, stemX, stemEndY };
}

function isBeamable(note) {
  return note.rhythm === "quaver" || note.rhythm === "triplet-quaver";
}

function getBeamGroups(notes) {
  const groups = [];
  let index = 0;
  while (index < notes.length) {
    if (!isBeamable(notes[index])) {
      index += 1;
      continue;
    }
    const start = index;
    const groupId = notes[index].targetGroupId || `ordinary-${start}`;
    while (index < notes.length) {
      const note = notes[index];
      const currentGroupId = note.targetGroupId || `ordinary-${start}`;
      if (!isBeamable(note) || currentGroupId !== groupId) break;
      index += 1;
    }
    const end = index - 1;
    if (end > start) groups.push({ start, end });
  }
  return groups;
}

function groupContaining(groups, noteIndex) {
  return groups.find((group) => noteIndex >= group.start && noteIndex <= group.end) || null;
}

function getBeamData(notes, positions, systemTop) {
  const averageStep = notes.reduce((sum, note) => sum + note.step, 0) / notes.length;
  const down = averageStep > 4;
  const anchorStep = down ? Math.max(...notes.map((note) => note.step)) : Math.min(...notes.map((note) => note.step));
  const anchorIndex = Math.max(0, notes.findIndex((note) => note.step === anchorStep));
  const firstStem = getStemData(notes[0], positions[0], systemTop, down);
  const lastStem = getStemData(notes[notes.length - 1], positions[positions.length - 1], systemTop, down);
  const anchorStem = getStemData(notes[anchorIndex], positions[anchorIndex], systemTop, down);
  const rawSlope = (notes[notes.length - 1].step - notes[0].step) * -2;
  const totalSlope = clamp(rawSlope, -8, 8);
  const totalX = Math.max(1, lastStem.stemX - firstStem.stemX);
  const slopePerX = totalSlope / totalX;
  return {
    down,
    start: {
      x: firstStem.stemX,
      y: anchorStem.stemEndY - slopePerX * (anchorStem.stemX - firstStem.stemX),
    },
    end: {
      x: lastStem.stemX,
      y: anchorStem.stemEndY + slopePerX * (lastStem.stemX - anchorStem.stemX),
    },
  };
}

function beamYAtX(x, beam) {
  if (!beam) return 0;
  const denominator = beam.end.x - beam.start.x || 1;
  const progress = (x - beam.start.x) / denominator;
  return beam.start.y + progress * (beam.end.y - beam.start.y);
}

function noteColour(noteId, selectedNoteIds, feedback, targetNoteIds) {
  const selected = selectedNoteIds.includes(noteId);
  const target = targetNoteIds.includes(noteId);
  if (!feedback) return "currentColor";
  if (target) return COLOUR.green;
  if (selected) return COLOUR.red;
  return "currentColor";
}

function findNoteGroup(layouts, noteIds) {
  if (!Array.isArray(noteIds) || noteIds.length !== 3) return null;
  for (const layout of layouts) {
    const indexes = layout.bar.notes
      .map((note, index) => noteIds.includes(note.id) ? index : -1)
      .filter((index) => index >= 0);
    if (indexes.length === 3) {
      const notes = indexes.map((index) => layout.bar.notes[index]);
      const positions = indexes.map((index) => layout.positions[index]);
      if (notes.length === 3 && positions.every((value) => Number.isFinite(value))) {
        return { notes, positions, indexes, systemTop: layout.systemTop };
      }
    }
  }
  return null;
}

function isValidTripletGroup(group) {
  return Boolean(
    group &&
    Array.isArray(group.notes) &&
    Array.isArray(group.positions) &&
    group.notes.length === 3 &&
    group.positions.length === 3 &&
    group.positions.every((value) => Number.isFinite(value)) &&
    Number.isFinite(group.systemTop)
  );
}

function tripletTypeFromGroup(group) {
  if (!isValidTripletGroup(group)) return null;
  if (Array.isArray(group.indexes) && group.indexes.some((index, itemIndex) => itemIndex > 0 && index !== group.indexes[itemIndex - 1] + 1)) return null;
  const displayRhythm = note => note.rhythm === "triplet-quaver" ? "quaver" : note.rhythm === "triplet-crotchet" ? "crotchet" : note.rhythm;
  const rhythm = displayRhythm(group.notes[0]);
  if (!group.notes.every((note) => displayRhythm(note) === rhythm)) return null;
  if (rhythm === "quaver" || rhythm === "triplet-quaver") return TRIPLET_TYPES.find((type) => type.id === "quaver-triplet") || null;
  if (rhythm === "crotchet" || rhythm === "triplet-crotchet") return TRIPLET_TYPES.find((type) => type.id === "crotchet-triplet") || null;
  return null;
}

function tripletSelectionIsValid(question, noteIds) {
  const group = findNoteGroup(buildLayouts(question), noteIds);
  const type = tripletTypeFromGroup(group);
  if (!type) return false;
  const bar = question.bars.find(item => group.notes.every(note => item.notes.includes(note)));
  if (!bar) return false;
  if (type.id === "quaver-triplet") {
    const beam = getBeamGroups(bar.notes).find(item => item.start === group.indexes[0]);
    if (!beam || beam.end !== group.indexes[2]) return false;
  }
  const printedBeats = note => rhythmInfo(note.rhythm === "triplet-quaver" ? "quaver" : note.rhythm === "triplet-crotchet" ? "crotchet" : note.rhythm).beats;
  const correctedTotal = bar.notes.reduce((sum,note) => sum + printedBeats(note), 0)
    - group.notes.reduce((sum,note) => sum + printedBeats(note), 0) + type.beats;
  return Math.abs(correctedTotal - question.timeSignature.beats) < 1e-8;
}

const playFeedbackSound = (...args) => window.MLH?.playFeedbackSound?.(...args);

const SHARED_SYMBOLS = window.BRAVURA_SYMBOLS || {};
const SHARED_CONFIG = window.SHARED_NOTATION_CONFIG || { drawing: {}, symbols: {} };

const TIME_SIGNATURE_SYMBOLS = {
  "2/4": { top: ["timeSig2"], bottom: ["timeSig4"], key: "timeSig24" },
  "3/4": { top: ["timeSig3"], bottom: ["timeSig4"], key: "timeSig34" },
  "4/4": { top: ["timeSig4"], bottom: ["timeSig4"], key: "timeSig44" },
  "6/8": { top: ["timeSig6"], bottom: ["timeSig8"], key: "timeSig68" },
  "9/8": { top: ["timeSig9"], bottom: ["timeSig8"], key: "timeSig98" },
  "12/8": { top: ["timeSig1", "timeSig2"], bottom: ["timeSig8"], key: "timeSig128" },
};

function sharedActualSymbolKey(key) {
  const aliases = {
    augmentationDotSpace: "augmentationDot",
    augmentationDotLine: "augmentationDot",
    noteheadBlackStemUp: "noteheadBlack",
    noteheadBlackStemDown: "noteheadBlack",
    sharpKeySignature: "sharp",
    flatKeySignature: "flat",
    sharpInScore: "sharp",
    flatInScore: "flat",
  };
  return aliases[key] || key;
}

function sharedSymbolConfig(key) {
  const symbols = SHARED_CONFIG.symbols || {};
  return symbols[key] || symbols[sharedActualSymbolKey(key)] || {
    fontSizeScale: 3.4,
    xOffsetScale: 0,
    yOffsetScale: 0,
    widthScale: 1,
    heightScale: 1,
    opticalXOffset: 0,
    opticalYOffset: 0,
  };
}

function sharedSymbolForKey(key) {
  return SHARED_SYMBOLS[sharedActualSymbolKey(key)] || "";
}

function CalibratedSymbol({ symbolKey, x, y, colour = "currentColor", opacity = 1, lineGap = STAFF.gap, settingOverrides = {} }) {
  const settings = { ...sharedSymbolConfig(symbolKey), ...settingOverrides };
  const fontSize = lineGap * Number(settings.fontSizeScale || 1);
  const xOffset = lineGap * Number(settings.xOffsetScale || 0) + Number(settings.opticalXOffset || 0);
  const yOffset = lineGap * Number(settings.yOffsetScale || 0) + Number(settings.opticalYOffset || 0);
  const adjustedX = x + xOffset;
  const adjustedY = y + yOffset;
  const symbol = sharedSymbolForKey(symbolKey);
  if (!symbol) return null;

  return (
    <text
      x={adjustedX}
      y={adjustedY}
      className="music-symbol"
      fontSize={fontSize}
      textAnchor="middle"
      fill={colour}
      opacity={opacity}
      transform={`translate(${adjustedX} ${adjustedY}) scale(${settings.widthScale || 1} ${settings.heightScale || 1}) translate(${-adjustedX} ${-adjustedY})`}
      pointerEvents="none"
    >
      {symbol}
    </text>
  );
}

function StaffLines({ systemTop }) {
  return (
    <g>
      {[0, 1, 2, 3, 4].map((line) => (
        <line key={line} x1={STAFF.left} x2={STAFF.right} y1={systemTop + line * STAFF.gap} y2={systemTop + line * STAFF.gap} stroke="currentColor" strokeWidth="1.2" />
      ))}
    </g>
  );
}

function TrebleClef({ systemTop }) {
  return <CalibratedSymbol symbolKey="gClef" x={CLEF_X + STAFF.gap * 2.3} y={yForStep(systemTop, 2)} />;
}

function KeySignature({ keySignature, systemTop }) {
  return (
    <g pointerEvents="none">
      {(keySignature?.signature || []).map((item, index) => (
        <CalibratedSymbol
          key={`${item.type}-${index}`}
          symbolKey={item.type === "sharp" ? "sharpKeySignature" : "flatKeySignature"}
          x={KEY_SIGNATURE_X + index * KEY_SIGNATURE_SPACING}
          y={yForStep(systemTop, item.step)}
        />
      ))}
    </g>
  );
}

function TimeSignature({ signature, systemTop, colour = "currentColor" }) {
  const definition = TIME_SIGNATURE_SYMBOLS[signature.id] || { top: [`timeSig${signature.top}`], bottom: [`timeSig${signature.bottom}`], key: `timeSig${signature.top}${signature.bottom}` };
  const settings = sharedSymbolConfig(definition.key);
  const fontSize = STAFF.gap * Number(settings.fontSizeScale || 3.5);
  const anchorY = yForStep(systemTop, 5.3);
  const adjustedX = TIME_SIG_X + STAFF.gap * Number(settings.xOffsetScale || 0) + Number(settings.opticalXOffset || 0);
  const adjustedY = anchorY + STAFF.gap * Number(settings.yOffsetScale || 0) + Number(settings.opticalYOffset || 0);
  const topText = definition.top.map((symbolKey) => sharedSymbolForKey(symbolKey)).join("");
  const bottomText = definition.bottom.map((symbolKey) => sharedSymbolForKey(symbolKey)).join("");

  return (
    <g transform={`translate(${adjustedX} ${adjustedY}) scale(${settings.widthScale || 1} ${settings.heightScale || 1}) translate(${-adjustedX} ${-adjustedY})`} fill={colour} pointerEvents="none">
      <text className="music-symbol" x={adjustedX} y={adjustedY - fontSize * 0.14} fontSize={fontSize} textAnchor="middle">{topText}</text>
      <text className="music-symbol" x={adjustedX} y={adjustedY + fontSize * 0.43} fontSize={fontSize} textAnchor="middle">{bottomText}</text>
    </g>
  );
}

function Accidental({ value, x, y, colour = "currentColor" }) {
  if (!value) return null;
  return <CalibratedSymbol symbolKey={value === 1 ? "sharpInScore" : "flatInScore"} x={x} y={y} colour={colour} />;
}

function LedgerLines({ x, step, systemTop, colour }) {
  const settings = sharedSymbolConfig("ledgerLines");
  const lineWidth = STAFF.gap * Number(SHARED_CONFIG.drawing?.ledgerLineWidthScale || 2.4) * Number(settings.widthScale || 1);
  const thickness = STAFF.gap * Number(SHARED_CONFIG.drawing?.ledgerLineThicknessScale || 0.11) * Number(settings.heightScale || 1);
  const lines = [];
  if (step <= -2) lines.push(yForStep(systemTop, -2));
  if (step >= 10) lines.push(yForStep(systemTop, 10));
  return (
    <g>
      {lines.map((y) => <line key={y} x1={x - lineWidth / 2} x2={x + lineWidth / 2} y1={y} y2={y} stroke={colour} strokeWidth={thickness} strokeLinecap="round" />)}
    </g>
  );
}

function noteSymbolKey(note, stemDown, beamed) {
  if (note.rhythm === "semibreve") return "wholeNote";
  if (note.rhythm === "minim" || note.rhythm === "dotted-minim") return stemDown ? "halfNoteStemDown" : "halfNoteStemUp";
  if (beamed) return stemDown ? "noteheadBlackStemDown" : "noteheadBlackStemUp";
  if (note.rhythm === "quaver" || note.rhythm === "triplet-quaver") return stemDown ? "eighthNoteStemDown" : "eighthNoteStemUp";
  return stemDown ? "quarterNoteStemDown" : "quarterNoteStemUp";
}

function NoteHead({ note, x, systemTop, colour, selected = false, forcedStemDown = null, forcedStemEndY = null, showFlag = true, onPointerDown, disabled = false }) {
  const info = rhythmInfo(note.rhythm);
  const stem = getStemData(note, x, systemTop, forcedStemDown);
  const stemEndY = forcedStemEndY === null ? stem.stemEndY : forcedStemEndY;
  const beamed = info.flag && !showFlag;
  const symbolKey = noteSymbolKey(note, stem.down, beamed);
  const dotKey = Math.abs(note.step % 2) === 1 ? "augmentationDotSpace" : "augmentationDotLine";
  const dotY = Math.abs(note.step % 2) === 1 ? stem.y : stem.y - STAFF.gap * 0.25;
  const stemThickness = Math.max(1, STAFF.gap * Number(SHARED_CONFIG.drawing?.stemThicknessScale || 0.12));

  return (
    <g onPointerDown={onPointerDown} role="button" tabIndex={disabled ? -1 : 0} aria-disabled={disabled} aria-pressed={selected} aria-label={`Select note ${Number(note.id.split("-")[1])+1} in bar ${Number(note.id.split("-")[0])+1}`} onKeyDown={event=>{if(disabled || (event.key!=="Enter" && event.key!==" "))return;event.preventDefault();onPointerDown?.(event);}} className={disabled ? "" : "cursor-pointer"} filter={selected ? "url(#selectedNoteGlow)" : undefined}>
      <circle cx={x} cy={stem.y} r="17" fill="transparent" />
      <LedgerLines x={x} step={note.step} systemTop={systemTop} colour={colour} />
      <Accidental value={note.writtenAccidental} x={x - STAFF.gap * 2.2} y={stem.y} colour={colour} />
      <CalibratedSymbol symbolKey={symbolKey} x={x} y={stem.y} colour={colour} />
      {beamed && <line x1={stem.stemX} x2={stem.stemX} y1={stem.y} y2={stemEndY} stroke={colour} strokeWidth={stemThickness} strokeLinecap="butt" />}
      {info.dot && <CalibratedSymbol symbolKey={dotKey} x={x + STAFF.gap * 1.3} y={dotY} colour={colour} />}
    </g>
  );
}

function Beam({ beam, colour, glow = false }) {
  const settings = sharedSymbolConfig("quaverBeam");
  const thickness = STAFF.gap * Number(SHARED_CONFIG.drawing?.beamThicknessScale || 0.42) * Number(settings.heightScale || 1);
  const widthScale = Number(settings.widthScale || 1);
  const xExtend = Math.max(1, STAFF.gap * (widthScale - 1));
  const x1 = beam.start.x - xExtend;
  const x2 = beam.end.x + xExtend;
  return (
    <g>
      {glow && <line x1={x1} y1={beam.start.y} x2={x2} y2={beam.end.y} stroke="#facc15" strokeWidth={thickness + 7} strokeLinecap="butt" opacity="0.65" />}
      {glow && <line x1={x1} y1={beam.start.y} x2={x2} y2={beam.end.y} stroke="#eab308" strokeWidth={thickness + 3} strokeLinecap="butt" opacity="0.75" />}
      <line x1={x1} y1={beam.start.y} x2={x2} y2={beam.end.y} stroke={colour} strokeWidth={thickness} strokeLinecap="butt" />
    </g>
  );
}

function TripletMark({ group, tripletType, colour = COLOUR.green, glow = false }) {
  if (!isValidTripletGroup(group) || !tripletType) return null;
  const filter = glow ? "url(#selectedNoteGlow)" : undefined;

  if (tripletType.id === "quaver-triplet") {
    const centreX = group.positions[1];
    const beam = getBeamData(group.notes, group.positions, group.systemTop);
    const yOnBeam = beamYAtX(centreX, beam);
    const y = beam.down ? yOnBeam + 24 : yOnBeam - 6;
    const x = beam.down ? centreX - 5 : centreX + 4;
    return <text x={x} y={y} textAnchor="middle" fontFamily="serif" fontWeight="900" fontSize="24" fill={colour} filter={filter}>3</text>;
  }

  const x1 = group.positions[0] - 10;
  const x2 = group.positions[2] + 10;
  const y = group.systemTop - 24;
  const centreX = (x1 + x2) / 2;
  return (
    <g stroke={colour} fill={colour} filter={filter}>
      <g stroke={colour} strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round">
        <path d={`M ${x1} ${y + 8} L ${x1} ${y} L ${centreX - 12} ${y}`} />
        <path d={`M ${centreX + 12} ${y} L ${x2} ${y} L ${x2} ${y + 8}`} />
      </g>
      <text x={centreX} y={y + 6} textAnchor="middle" fontFamily="serif" fontWeight="900" fontSize="24">3</text>
    </g>
  );
}

function ScoreArea({ question, selectedNoteIds, feedback, onToggleNote, readOnly = false }) {
  const layouts = useMemo(() => buildLayouts(question), [question]);
  const selectedGroup = selectedNoteIds.length === 3 ? findNoteGroup(layouts, selectedNoteIds) : null;
  const selectedTripletType = tripletTypeFromGroup(selectedGroup);
  const feedbackNoteIds = feedback === "correct" ? selectedNoteIds : question.targetNoteIds;
  const targetGroup = feedback ? findNoteGroup(layouts, feedbackNoteIds) : null;
  const visibleMarkGroup = readOnly ? findNoteGroup(layouts, question.targetNoteIds) : feedback ? targetGroup : selectedGroup;
  const visibleMarkType = readOnly || feedback ? question.tripletType : selectedTripletType;

  const tops = STAFF.tops.slice(0, Math.ceil(question.bars.length / BARS_PER_SYSTEM));
  const height = tops.length < STAFF.tops.length ? tops.at(-1) + STAFF.gap * 4 + 52 : SVG.height;
  return (
    <svg viewBox={`0 0 ${SVG.width} ${height}`} className="h-auto w-full select-none touch-manipulation overflow-visible" aria-label="Triplet exercise">
      <defs>
        <filter id="selectedNoteGlow" x="-150%" y="-150%" width="400%" height="400%">
          <feDropShadow dx="0" dy="0" stdDeviation="2.2" floodColor="#facc15" floodOpacity="0.95" />
          <feDropShadow dx="0" dy="0" stdDeviation="4.2" floodColor="#eab308" floodOpacity="0.85" />
        </filter>
      </defs>
      <rect width={SVG.width} height={height} fill="white" />

      {tops.map((systemTop, systemIndex) => (
        <g key={systemIndex}>
          <StaffLines systemTop={systemTop} />
          <TrebleClef systemTop={systemTop} />
          <KeySignature keySignature={question.key} systemTop={systemTop} />
          {systemIndex === 0 && <TimeSignature signature={question.timeSignature} systemTop={systemTop} />}
        </g>
      ))}

      {layouts.map((layout) => {
        const groups = getBeamGroups(layout.bar.notes);
        return (
          <g key={layout.barIndex}>
            {layout.bar.notes.map((note, noteIndex) => {
              const group = groupContaining(groups, noteIndex);
              const groupNotes = group ? layout.bar.notes.slice(group.start, group.end + 1) : null;
              const groupPositions = group ? layout.positions.slice(group.start, group.end + 1) : null;
              const beam = group ? getBeamData(groupNotes, groupPositions, layout.systemTop) : null;
              const stem = group ? getStemData(note, layout.positions[noteIndex], layout.systemTop, beam.down) : null;
              const forcedStemEndY = group && stem ? beamYAtX(stem.stemX, beam) : null;
              const colour = noteColour(note.id, selectedNoteIds, feedback, feedbackNoteIds);

              return (
                <NoteHead
                  key={note.id}
                  note={note}
                  x={layout.positions[noteIndex]}
                  systemTop={layout.systemTop}
                  colour={colour}
                  selected={!feedback && selectedNoteIds.includes(note.id)}
                  forcedStemDown={group ? beam.down : null}
                  forcedStemEndY={forcedStemEndY}
                  showFlag={!group}
                  disabled={readOnly || Boolean(feedback)}
                  onPointerDown={(event) => {
                    if (feedback) return;
                    event.stopPropagation();
                    onToggleNote(note.id);
                  }}
                />
              );
            })}

            {groups.map((group, groupIndex) => {
              const groupNotes = layout.bar.notes.slice(group.start, group.end + 1);
              const groupPositions = layout.positions.slice(group.start, group.end + 1);
              const beam = getBeamData(groupNotes, groupPositions, layout.systemTop);
              const groupNoteIds = groupNotes.map((note) => note.id);
              const selected = groupNoteIds.every((id) => selectedNoteIds.includes(id));
              const targetAfterFeedback = feedback && groupNoteIds.every((id) => feedbackNoteIds.includes(id));
              return <Beam key={groupIndex} beam={beam} colour={targetAfterFeedback ? COLOUR.green : "currentColor"} glow={!feedback && selected} />;
            })}

            {layout.barIndex === question.bars.length - 1 ? (
              <g>
                <line x1={layout.endX - 5} x2={layout.endX - 5} y1={layout.systemTop - 0.5} y2={layout.systemTop + STAFF.gap * 4 + 0.5} stroke="currentColor" strokeWidth="1.4" />
                <line x1={layout.endX} x2={layout.endX} y1={layout.systemTop - 0.5} y2={layout.systemTop + STAFF.gap * 4 + 0.5} stroke="currentColor" strokeWidth="4" />
              </g>
            ) : (
              <line x1={layout.endX} x2={layout.endX} y1={layout.systemTop} y2={layout.systemTop + STAFF.gap * 4} stroke="currentColor" strokeWidth="1.4" />
            )}
          </g>
        );
      })}

      <TripletMark group={visibleMarkGroup} tripletType={visibleMarkType} colour={feedback ? COLOUR.green : "currentColor"} glow={!feedback && Boolean(visibleMarkGroup)} />
    </svg>
  );
}

const getStreakMedal = (streak) => window.MLH?.getStreakMedal?.(streak);


function FeedbackBanner({ feedback, fading }) {
  if (!feedback) return null;
  return <window.MLH.FeedbackBadge feedback={{ correct: feedback === "correct" }} fading={fading} animationPrefix="note" />;
}

function useInjectedStyles() {
  useEffect(() => {
    if (document.getElementById("triplets-golden-style")) return;
    const style = document.createElement("style");
    style.id = "triplets-golden-style";
    style.innerHTML = `
      button { -webkit-tap-highlight-color: transparent; user-select: none; transition: transform 0.08s ease, filter 0.08s ease, background-color 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }
      button:hover { transform: translateY(-1px) scale(1.01); filter: brightness(1.08); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
      button:active { transform: scale(0.96); filter: brightness(0.92); }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      button:focus-visible { outline: 2px solid rgba(22,163,74,0.35); outline-offset: 2px; }
      @keyframes medalShine { 0%,100% { transform: scale(1) rotate(-4deg); filter: drop-shadow(0 0 0 rgba(250,204,21,0)); } 50% { transform: scale(1.16) rotate(4deg); filter: drop-shadow(0 0 10px rgba(250,204,21,.9)); } }
      @keyframes confettiDrop { 0% { transform: translateY(-12px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(72px) rotate(260deg); opacity: 0; } }
      @keyframes incorrectDropShake { 0% { transform: translateY(-28px); opacity: 0; } 55% { transform: translateY(0); opacity: 1; } 68% { transform: translateX(-5px); } 78% { transform: translateX(5px); } 88% { transform: translateX(-3px); } 100% { transform: translateX(0); opacity: 1; } }
      @keyframes correctFade { 0% { transform: translateY(-18px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
      @keyframes feedbackFadeOut { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
    `;
    document.head.appendChild(style);
  }, []);
}

const useClickOutside = window.MLH.useClickOutside;

function App() {
  useInjectedStyles();

  const [question, setQuestion] = useState(() => createQuestion());
  const [questionVisible, setQuestionVisible] = useState(true);
  const [activeLevel, setActiveLevel] = useState("H");
  const [levelOpen, setLevelOpen] = useState(false);
  const [selectedNoteIds, setSelectedNoteIds] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const [feedbackFading, setFeedbackFading] = useState(false);
  const [prompt, setPrompt] = useState("");
  const [correct, setCorrect] = window.MLH.usePersistentScoreState(0, "correct", { level: activeLevel, scope: "", settings: { questions: null, options: {} } });
  const [attempted, setAttempted] = window.MLH.usePersistentScoreState(0, "attempted", { level: activeLevel, scope: "", settings: { questions: null, options: {} } });
  const [streak, setStreak] = window.MLH.usePersistentScoreState(0, "streak", { level: activeLevel, scope: "", settings: { questions: null, options: {} } });
  const [bestStreak, setBestStreak] = window.MLH.usePersistentScoreState(0, "bestStreak", { level: activeLevel, scope: "", settings: { questions: null, options: {} } });
  const [confettiKey, setConfettiKey] = useState(0);

  const levelRef = useRef(null);
  const feedbackTimersRef = useRef([]);
  const questionTimerRef = useRef(null);

  useClickOutside([levelRef], [() => levelOpen && setLevelOpen(false)]);
  useEffect(() => () => { window.clearTimeout(questionTimerRef.current); clearFeedbackTimers(); }, []);

  const accuracy = attempted === 0 ? 0 : Math.round((correct / attempted) * 100);
  const canConfirm = selectedNoteIds.length === 3 && !feedback;
  const streakMedal = getStreakMedal(streak);
  const scoreFeedback = feedback;

  function clearFeedbackTimers() {
    feedbackTimersRef.current.forEach((timerId) => window.clearTimeout(timerId));
    feedbackTimersRef.current = [];
  }

  function scheduleFeedbackTimer(callback, delay) {
    const timerId = window.setTimeout(() => {
      feedbackTimersRef.current = feedbackTimersRef.current.filter((id) => id !== timerId);
      callback();
    }, delay);
    feedbackTimersRef.current.push(timerId);
  }

  function resetTask(nextQuestion) {
    setQuestion(nextQuestion);
    setSelectedNoteIds([]);
    setFeedback(null);
    setFeedbackFading(false);
    setPrompt("");
  }

  function newQuestion() {
    clearFeedbackTimers();
    window.clearTimeout(questionTimerRef.current);
    setQuestionVisible(false);
    questionTimerRef.current = window.setTimeout(() => {
      resetTask(createQuestion());
      setQuestionVisible(true);
      questionTimerRef.current = null;
    }, 260);
  }

  function resetScore() {
    setCorrect(0);
    setAttempted(0);
    setStreak(0);
    setBestStreak(0);
    setConfettiKey(0);
    newQuestion();
  }

  function applyLevel(level) {
    if (!LEVELS[level]) return;
    setActiveLevel(level);
    setLevelOpen(false);
    newQuestion();
  }

  function fadeToNextQuestion() {
    if (!feedback || feedbackFading) return;
    clearFeedbackTimers();
    setFeedbackFading(true);
    scheduleFeedbackTimer(newQuestion, 280);
  }

  function toggleNote(noteId) {
    if (feedback) return;

    setSelectedNoteIds((current) => {
      if (current.includes(noteId)) return current.filter((id) => id !== noteId);
      if (current.length >= 3) return [...current.slice(1), noteId];
      return [...current, noteId];
    });
    setPrompt("");
  }

  function scoreAnswer(feedbackType) {
    const isCorrect = feedbackType === "correct";
    const nextStreak = isCorrect ? streak + 1 : 0;
    playFeedbackSound(isCorrect);
    setAttempted((value) => value + 1);
    setCorrect((value) => value + (isCorrect ? 1 : 0));
    setStreak(nextStreak);
    setBestStreak((value) => Math.max(value, nextStreak));
    setFeedback(feedbackType);

    if (isCorrect && [10, 15, 20, 30].includes(nextStreak)) {
      const medal = getStreakMedal(nextStreak);
      setConfettiKey((value) => value + 1);
      window.setTimeout(() => playFeedbackSound(true, true, medal.sound), 180);
    }

    if (isCorrect) {
      setFeedbackFading(false);
      scheduleFeedbackTimer(() => setFeedbackFading(true), 1700);
      scheduleFeedbackTimer(newQuestion, 2000);
    }
  }

  function confirmAnswer() {
    if (feedback) return;
    if (selectedNoteIds.length !== 3) {
      setPrompt("Select exactly three notes before pressing Confirm.");
      return;
    }

    const selectedGroup = findNoteGroup(buildLayouts(question), selectedNoteIds);
    const selectedTripletType = tripletTypeFromGroup(selectedGroup);
    const notesCorrect = tripletSelectionIsValid(question, selectedNoteIds);
    const typeCorrect = selectedTripletType?.id === question.tripletType.id;
    const feedbackType = notesCorrect && typeCorrect ? "correct" : notesCorrect && !typeCorrect ? "wrong-type" : "incorrect";
    setPrompt("");
    scoreAnswer(feedbackType);
  }

  return (
    <div className={window.MLH.shell.pageShellClass}>
      <window.MLH.AppHeader icon={ASSET.appIcon} title="Triplets" subtitle="Identify quaver and crotchet triplets." worksheetConfig={() => ({ version: 1, activityId: "triplets", sourceUrl: window.location.href, settings: { level: activeLevel } })}>
        <window.MLH.ScoreStreakPanel achievementLevel={activeLevel} assets={ASSET} correct={correct} attempted={attempted} accuracy={accuracy} streak={streak} bestStreak={bestStreak} resetScore={resetScore} confettiKey={confettiKey} />
      </window.MLH.AppHeader>

      <div className={window.MLH.shell.pageContentClass}>
        <main
          className={`${window.MLH.shell.mainShellClass} flex flex-col pb-5 md:pb-6`}
          onPointerDown={(event) => {
            if (event.target.closest("button,input,[data-menu-trigger],[data-menu-panel]")) return;
            if (feedback) fadeToNextQuestion();
          }}
        >
          <window.MLH.AppToolbar
            left={
              <div className="flex items-center gap-2">
                <div className="hub-menu-anchor relative" ref={levelRef}>
                  <window.MLH.LevelButton
                    icon={<img src={ASSET.levels} alt="" aria-hidden="true" className="h-[26px] w-[26px] object-contain" />}
                    activeLevel={activeLevel}
                    activeLabel={LEVELS[activeLevel].label}
                    onClick={() => setLevelOpen((value) => !value)}
                    dataMenuTrigger={true}
                  />
                  {levelOpen && <window.MLH.MenuPanel title="Level" position="left-0" dataMenuPanel={true}>
                    <window.MLH.LevelMenu activeLevel={activeLevel} onSelect={applyLevel} levels={LEVELS} />
                  </window.MLH.MenuPanel>}
                </div>
              </div>
            }
            feedback={<FeedbackBanner feedback={feedback} fading={feedbackFading} />}
            right={<window.MLH.SkipButton resetStreak={() => setStreak(0)} onClick={newQuestion} icon={<img src={ASSET.next} alt="" aria-hidden="true" className="h-[27.8px] w-[27.8px] object-contain" />} />}
          />

          <div className={`relative -top-[20px] flex min-h-[330px] items-center justify-center overflow-visible rounded-xl transition-opacity duration-300 md:min-h-[410px] ${questionVisible ? "opacity-100" : "opacity-0"}`}>
            <div className="w-[115%] max-w-none shrink-0 md:w-[100%]">
              <ScoreArea
                question={question}
                selectedNoteIds={selectedNoteIds}
                feedback={scoreFeedback}
                onToggleNote={toggleNote}
              />
            </div>
          </div>

          <div className="relative z-10 -mt-[50px] min-h-[74px] overflow-hidden rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 shadow-md md:mx-3">
            <div className="flex flex-wrap items-center justify-between gap-3 text-stone-900">
              <div className="min-w-0 flex-1">
                <p className="text-base font-semibold leading-tight">Identify the triplet in the music by selecting <strong>three</strong> notes.</p>
                {prompt && <p className="mt-1 text-sm font-medium text-red-700">{prompt}</p>}
              </div>
              <window.MLH.ConfirmButton onClick={confirmAnswer} disabled={!canConfirm}>Confirm</window.MLH.ConfirmButton>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

function EscapeClue({ activity }) {
  const embed = window.MLH.EscapeLiteracyActivity;
  const ref = embed.useContentHeight(activity);
  const question = embed.useQuestion(activity, () => createQuestion(4));

  return <main ref={ref} className="escape-literacy-content">
    <p className="escape-literacy-content-title">{"How many crotchet beats does the marked triplet last?"}</p>
    <ScoreArea question={question} selectedNoteIds={[]} readOnly />
    <embed.NumberedOptions activity={activity} choices={embed.numberedChoices(question.tripletType.beats, [0.5, 1, 2, 3], activity.clue.digit)} columns={2} />
  </main>;
}
